<!doctype html><meta charset="utf-8"><title>DailyTown R-B static preflight</title>
<style>:root{--paper:#F4EBDD;--ink:#453B30;--moss:#68704E}*{box-sizing:border-box}body{margin:0;background:#EEE9DE;color:var(--ink);font:14px/1.45 system-ui,-apple-system,"Noto Sans KR",sans-serif}main{max-width:1500px;margin:auto;padding:28px}h1{margin:0}.warn{margin:12px 0 22px;background:#fff3cd;border:1px solid #dec676;border-radius:12px;padding:10px 14px}.section{margin:28px 0}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.cell{min-height:210px;border-radius:20px;overflow:hidden;border:1px solid #cfcac0;position:relative;display:grid;place-items:center}.cream{background:#F4EBDD}.dark{background:#2D342C}.map-heavy{background-image:linear-gradient(#ffffff22,#ffffff22),url('../../../reference/baseline-v2/dailytown_ux_visual_baseline_v2.png');background-size:cover;background-position:center}.tag{position:absolute;left:8px;top:8px;background:#fffde8;padding:5px 8px;border-radius:9px;font-size:11px;box-shadow:0 2px 6px #0002}.moru{object-fit:contain;filter:none}.cap{margin-top:8px;color:#74685B}.rowtitle{margin:20px 0 8px;font-size:18px;color:var(--moss)}@media(max-width:900px){.grid{grid-template-columns:1fr}}</style>
<main><h1>R-B static design preflight</h1><div class="warn"><b>NOT PHYSICAL PASS.</b> This page reuses accepted Moru assets for design-only contrast comparison. Final R-B verdict requires the actual Android app on a physical device outdoors.</div><div id="app"></div></main>
<script>
const root='../../../reference/moru-v2/';
const assets={
 map_avatar:{LIGHT:root+'native-usage-context-v1/candidate/companion_moru_v2_map_avatar_neutral_LIGHT_base.png',WARM_DUSK:root+'native-lighting-family-v1/candidate/companion_moru_v2_map_avatar_neutral_WARM_DUSK_base.png',DARK:root+'native-lighting-family-v1/candidate/companion_moru_v2_map_avatar_neutral_DARK_base.png'},
 hud_portrait:{LIGHT:root+'native-usage-context-v1/candidate/companion_moru_v2_hud_portrait_neutral_LIGHT_base.png',WARM_DUSK:root+'native-lighting-family-v1/candidate/companion_moru_v2_hud_portrait_neutral_WARM_DUSK_base.png',DARK:root+'native-lighting-family-v1/candidate/companion_moru_v2_hud_portrait_neutral_DARK_base.png'}
};
const defs=[['map_avatar',[48,56,64]],['hud_portrait',[56,64,72]]], lights=['LIGHT','WARM_DUSK','DARK'], bgs=['cream','dark','map-heavy'];
let h='';
for(const [usage,sizes] of defs){h+=`<section class=section><h2>${usage}</h2>`;for(const size of sizes){h+=`<div class=rowtitle>${size} dp reference-size comparison</div><div class=grid>`;for(const light of lights){for(const bg of bgs){h+=`<div class="cell ${bg}"><span class=tag>${light} · ${bg} · ${size}dp</span><img class=moru src="${assets[usage][light]}" style="width:${size}px;height:${size}px"></div>`}}h+='</div>'}h+='</section>'}document.getElementById('app').innerHTML=h;
</script>
