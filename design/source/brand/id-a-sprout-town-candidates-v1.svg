<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="900" viewBox="0 0 1500 900">
<title>Daily Town ID-A Sprout Town Mark candidates v1</title>
<defs><style>.ink{fill:#1A1F1C}.green{fill:#6B8F7A;stroke:#214F3B;stroke-width:5}.paper{fill:#FFFDF7;stroke:#D8D3C3;stroke-width:2}.txt{font-family:sans-serif;fill:#1A1F1C}.small{font-family:sans-serif;font-size:16px;fill:#66756D}.line{stroke:#214F3B;stroke-width:6;stroke-linecap:round;stroke-linejoin:round;fill:none}</style></defs>
<rect width="1500" height="900" rx="30" fill="#EEF3F5"/><text x="40" y="55" class="txt" font-size="30" font-weight="700">Daily Town ID-A — Sprout Town Mark candidate family v1</text><text x="40" y="86" class="small">All candidates are character-independent and designed to survive companion variation.</text>

<g transform="translate(70 145)"><rect width="420" height="560" rx="28" class="paper"/><text x="145" y="44" class="txt" font-size="24" font-weight="700">ID-A1</text><text x="118" y="74" class="small">Sprout + Path</text>
<g transform="translate(210 255)"><path d="M0-5C-95-85-160-20-100 55C-48 52-15 25 0-5Z" class="green"/><path d="M0-5C95-85 160-20 100 55C48 52 15 25 0-5Z" class="green"/><path d="M0 20V90" class="line"/><path d="M-95 145Q0 55 95 145" class="line"/><path d="M-20 145Q0 105 20 145" class="line"/></g><text x="48" y="470" class="small">Strongest exploration cue; simple launcher silhouette.</text><text x="48" y="505" class="small">Risk: path can resemble generic location/eco app if too literal.</text></g>

<g transform="translate(540 145)"><rect width="420" height="560" rx="28" class="paper"/><text x="145" y="44" class="txt" font-size="24" font-weight="700">ID-A2</text><text x="104" y="74" class="small">Sprout + Door/Town</text>
<g transform="translate(210 255)"><path d="M0-5C-95-85-160-20-100 55C-48 52-15 25 0-5Z" class="green"/><path d="M0-5C95-85 160-20 100 55C48 52 15 25 0-5Z" class="green"/><path d="M0 20V78" class="line"/><path d="M-100 145L0 68L100 145Z" fill="#F7E7B8" stroke="#214F3B" stroke-width="6"/><rect x="-30" y="103" width="60" height="42" rx="10" fill="#FFFDF7" stroke="#214F3B" stroke-width="5"/></g><text x="42" y="470" class="small">Warmest “neighborhood/home” identity; distinctive story tone.</text><text x="42" y="505" class="small">Risk: town/house cue can become too domestic if over-detailed.</text></g>

<g transform="translate(1010 145)"><rect width="420" height="560" rx="28" class="paper"/><text x="145" y="44" class="txt" font-size="24" font-weight="700">ID-A3</text><text x="84" y="74" class="small">Sprout + Neighborhood Map</text>
<g transform="translate(210 255)"><path d="M0-5C-95-85-160-20-100 55C-48 52-15 25 0-5Z" class="green"/><path d="M0-5C95-85 160-20 100 55C48 52 15 25 0-5Z" class="green"/><path d="M0 20V75" class="line"/><circle cx="0" cy="128" r="78" fill="#F7F3E8" stroke="#214F3B" stroke-width="6"/><path d="M-58 120Q-18 82 12 118T62 116" class="line"/><circle cx="-56" cy="122" r="8" fill="#FFD36B" stroke="#214F3B" stroke-width="3"/><circle cx="60" cy="116" r="8" fill="#9CC9FF" stroke="#214F3B" stroke-width="3"/></g><text x="42" y="470" class="small">Most explicit real-world exploration meaning; strong map association.</text><text x="42" y="505" class="small">Risk: slightly busier at adaptive/monochrome small sizes.</text></g>

<g transform="translate(70 745)"><rect width="1360" height="110" rx="20" class="paper"/><text x="24" y="34" class="txt" font-size="18" font-weight="700">Required family after final lock</text><text x="24" y="66" class="small">app icon round/square • Android adaptive foreground • monochrome icon • small favicon-like mark • horizontal Daily Town wordmark • stacked lockup</text><text x="24" y="94" class="small">Human gate: choose A1/A2/A3 after visual review. No candidate is production_export until final lock + launcher-size/monochrome QA.</text></g>
