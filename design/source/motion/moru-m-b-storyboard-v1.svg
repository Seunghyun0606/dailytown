<g transform="translate(665 141) scale(1.01)"><use href="#moru"/></g><text x="615" y="208" class="small">F2 exhale</text><path d="M755 145h65" class="line"/>
<g transform="translate(910 145)"><use href="#moru"/></g><text x="858" y="208" class="small">F3 stable end</text><text x="1110" y="92" class="small">Reduced motion: static resolved pose + brief opacity accent.</text><text x="1110" y="124" class="small">All sprite-gen frames require face/sprout/foot continuity and loop/grounding QA.</text><text x="1110" y="156" class="small">Context amplitudes: Map &lt; HUD &lt; Encounter/Result.</text></g>
