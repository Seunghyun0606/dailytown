<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="950" viewBox="0 0 1600 950">
<title>Daily Town M-B Responsive Soft motion storyboard v1</title>
<defs><style>.ink{fill:#1A1F1C}.line{stroke:#214F3B;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}.paper{fill:#FFFDF7;stroke:#D8D3C3;stroke-width:2}.body{fill:#F7E7B8;stroke:#214F3B;stroke-width:4}.leaf{fill:#6B8F7A;stroke:#214F3B;stroke-width:4}.scarf{fill:#6B8F7A;stroke:#214F3B;stroke-width:4}.txt{font-family:sans-serif;fill:#1A1F1C}.small{font-family:sans-serif;font-size:15px;fill:#66756D}</style></defs>
<rect width="1600" height="950" rx="30" fill="#EEF3F5"/><text x="40" y="54" class="txt" font-size="30" font-weight="700">M-B Responsive Soft — Moru motion storyboard v1</text><text x="40" y="84" class="small">Target personality approved. Timing/easing remain prototype QA values, not final locks.</text>
<g id="moru"><ellipse cx="0" cy="15" rx="55" ry="70" class="body"/><circle cx="-18" cy="3" r="6" class="ink"/><circle cx="18" cy="3" r="6" class="ink"/><path d="M-8 24Q0 30 8 24" fill="none" class="line"/><path d="M0-55C-22-88-50-74-38-50C-18-50-6-60 0-68Z" class="leaf"/><path d="M0-56C22-88 50-74 38-50C18-50 6-60 0-68Z" class="leaf"/><path d="M-48 38Q0 55 48 38L42 62Q0 50-42 62Z" class="scarf"/></g>

<g transform="translate(40 120)"><rect width="1520" height="250" rx="24" class="paper"/><text x="20" y="32" class="txt" font-size="20" font-weight="700">1. idle_breathe — LOOP / low amplitude</text>
<g transform="translate(180 155)"><use href="#moru"/></g><text x="130" y="228" class="small">F0 neutral ground</text><path d="M270 155h70" class="line"/>
<g transform="translate(430 151) scale(1.01 1.025)"><use href="#moru"/></g><text x="382" y="228" class="small">F1 slight inhale</text><path d="M520 155h70" class="line"/>
