<g transform="translate(405 153) rotate(-3)"><use href="#moru"/></g><text x="360" y="228" class="small">F1 anticipation</text><path d="M495 160h60" class="line"/>
<g transform="translate(640 145) scale(1.03)"><use href="#moru"/><circle cx="76" cy="-34" r="12" fill="#FFD36B" stroke="#214F3B" stroke-width="3"/><path d="M76-65v-20M100-54l14-14M52-54L38-68" class="line"/></g><text x="592" y="228" class="small">F2 clue hit</text><path d="M730 160h60" class="line"/>
<g transform="translate(875 150) scale(1.015)"><use href="#moru"/><circle cx="70" cy="-30" r="8" fill="#FFD36B"/></g><text x="834" y="228" class="small">F3 settle</text><path d="M965 160h60" class="line"/>
<g transform="translate(1110 155)"><use href="#moru"/></g><text x="1055" y="228" class="small">F4 clue_found hold</text><text x="1290" y="122" class="small">No repeated bounce loop.</text><text x="1290" y="152" class="small">Reaction must remain distinct from generic happy.</text></g>

<g transform="translate(40 670)"><rect width="1520" height="230" rx="24" class="paper"/><text x="20" y="32" class="txt" font-size="20" font-weight="700">3. resolved_settle — ONE SHOT / low→low amplitude</text>
