<g transform="translate(930 151) scale(1.01 1.025)"><use href="#moru"/></g><text x="882" y="228" class="small">F3 return</text><path d="M1020 155h70" class="line"/>
<g transform="translate(1180 155)"><use href="#moru"/></g><text x="1128" y="228" class="small">F4 loop seam</text><text x="1315" y="115" class="small">Map avatar: 25–40% of encounter amplitude</text><text x="1315" y="145" class="small">No foot sliding. Sprout secondary lag ≤ subtle.</text></g>

<g transform="translate(40 395)"><rect width="1520" height="250" rx="24" class="paper"/><text x="20" y="32" class="txt" font-size="20" font-weight="700">2. clue_react — ONE SHOT / medium readable reaction</text>
