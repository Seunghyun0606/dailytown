<svg xmlns="http://www.w3.org/2000/svg" width="1900" height="1020" viewBox="0 0 1900 1020">
<title>Daily Town five-tab visual parity v2 board</title>
<desc>Design-review board for Explore, Companion, Records, Goals and Settings. Not a runtime screenshot.</desc>
<defs><style>
.bg{fill:#EEF3F5}.phone{fill:#FCFCF8;stroke:#214F3B;stroke-width:3}.paper{fill:#F4F0E6;stroke:#D8D3C3;stroke-width:2}.raised{fill:#FFFDF7;stroke:#D8D3C3;stroke-width:2}.leaf{fill:#6B8F7A}.leaf2{fill:#A7C7A5}.ink{fill:#214F3B}.text{fill:#1A1F1C}.muted{fill:#66756D}.peach{fill:#FFB184}.butter{fill:#FFD36B}.sky{fill:#9CC9FF}.navy{fill:#1E2A44}.route{fill:none;stroke:#6F9F71;stroke-width:6;stroke-linecap:round;stroke-dasharray:14 10}.line{fill:none;stroke:#D8D3C3;stroke-width:2}.label{font-family:Arial,sans-serif;font-size:18px;font-weight:700;fill:#214F3B}.small{font-family:Arial,sans-serif;font-size:13px;fill:#66756D}.tiny{font-family:Arial,sans-serif;font-size:11px;fill:#66756D}.title{font-family:Arial,sans-serif;font-size:26px;font-weight:700;fill:#1A1F1C}
</style></defs>
<rect width="1900" height="1020" rx="28" class="bg"/>
<text x="42" y="55" class="title">Daily Town visual parity v2 — product composition board</text>
<text x="42" y="84" class="small">A1/A2 live exploration + A3 record artifacts + quiet utility shell. Material primitives are implementation details, not the visible art direction.</text>

