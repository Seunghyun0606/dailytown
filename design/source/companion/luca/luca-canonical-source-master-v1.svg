<text x="260" y="380" class="small">Expression geometry may vary by eyes/mouth/pose, but ear length, head mass, muzzle placement and body ratio stay locked.</text><text x="260" y="415" class="small">If an expression fails at compact size, fallback to neutral + semantic context effect rather than changing anatomy.</text></g>

<g transform="translate(1080 530)"><rect width="460" height="500" rx="24" class="paper"/><text x="20" y="32" class="txt" font-size="20" font-weight="700">Lighting + usage QA</text><text x="20" y="78" class="small">LIGHT — clean neutral daylight, high face readability</text><text x="20" y="112" class="small">WARM_DUSK — warm rim/local warmth, preserve gray fur</text><text x="20" y="146" class="small">DARK — cool ambient + restrained warm local highlight</text><text x="20" y="204" class="small">Required contexts:</text><text x="40" y="236" class="small">map_avatar / hud_portrait / encounter_halfbody</text><text x="40" y="266" class="small">result_large / journal_stamp / collection_icon / memory_vignette</text><text x="20" y="322" class="small">48dp rules:</text><text x="40" y="352" class="small">ears remain inside safe crop; face and scarf remain readable</text><text x="40" y="382" class="small">no hat/head accessory may merge both ears into one mass</text><text x="40" y="412" class="small">silhouette must remain distinct from Moru in black</text><text x="20" y="466" class="small">Status: approved source candidate; production_export after split QA + checksum.</text></g>
