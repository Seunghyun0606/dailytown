<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100">
<title>Daily Town Luca canonical source master v1</title>
<defs><style>.ink{fill:#1A1F1C}.outline{stroke:#24323A;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}.fur{fill:#D9E1E5;stroke:#24323A;stroke-width:5}.darkfur{fill:#4A5962;stroke:#24323A;stroke-width:5}.cream{fill:#F7E7B8;stroke:#24323A;stroke-width:5}.scarf{fill:#E69A3D;stroke:#24323A;stroke-width:5}.paper{fill:#FFFDF7;stroke:#D8D3C3;stroke-width:2}.txt{font-family:sans-serif;fill:#1A1F1C}.small{font-family:sans-serif;font-size:15px;fill:#66756D}</style></defs>
<rect width="1600" height="1100" rx="30" fill="#EEF3F5"/><text x="40" y="54" class="txt" font-size="30" font-weight="700">Luca — canonical production source master v1</text><text x="40" y="84" class="small">SC-B shipping companion. Tall-ear explorer. Distinct from Moru at 48dp. Ear-safe accessory constraint.</text>

