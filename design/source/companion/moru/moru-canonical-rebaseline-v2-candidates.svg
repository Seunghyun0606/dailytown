<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="920" viewBox="0 0 1440 920">
  <title>Daily Town Moru canonical rebaseline v2 candidates</title>
  <desc>Design-review-only vector board for MR-A Sprout Scout, MR-B Leafcap Wanderer and MR-C Pocket Gardener. Not a production export.</desc>
  <defs>
    <style>
      .bg{fill:#EEF3F5}.paper{fill:#FFFDF7;stroke:#D8D3C3;stroke-width:2}.ink{stroke:#214F3B;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}.thin{stroke:#214F3B;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.skin{fill:#F4D9A8}.cream{fill:#F7E7B8}.leaf{fill:#6B8F7A}.leaf2{fill:#A7C7A5}.scarf{fill:#D97254}.bag{fill:#9A6A3F}.boot{fill:#5F5146}.butter{fill:#FFD36B}.sky{fill:#9CC9FF}.navy{fill:#1E2A44}.eye{fill:#1A1F1C}.txt{font-family:Arial,sans-serif;fill:#1A1F1C}.muted{font-family:Arial,sans-serif;fill:#66756D}.label{font-family:Arial,sans-serif;fill:#214F3B;font-weight:700}.dash{fill:none;stroke:#A7C7A5;stroke-width:3;stroke-dasharray:7 7}
    </style>
  </defs>
  <rect width="1440" height="920" rx="32" class="bg"/>
  <text x="48" y="58" class="txt" font-size="30" font-weight="700">Moru canonical rebaseline v2 — silhouette candidates</text>
  <text x="48" y="91" class="muted" font-size="17">Goal: restore “Soft Botanical Explorer / small explorer”. v1 semantic expressions, lighting and affinity contracts remain reusable.</text>

  <!-- MR-A -->
  <g transform="translate(55 130)">
    <rect width="420" height="650" rx="28" class="paper"/>
    <text x="28" y="45" class="label" font-size="23">MR-A · Sprout Scout</text>
    <text x="28" y="74" class="muted" font-size="16">recommended starting family</text>
    <g transform="translate(210 330)">
      <!-- asymmetric sprout integrated into hood -->
      <path d="M-10-155C-45-190-79-180-80-143C-56-126-30-130-6-148Z" class="leaf ink"/>
      <path d="M8-158C36-195 72-188 79-153C59-133 34-131 9-146Z" class="leaf2 ink"/>
      <path d="M0-144Q8-171 27-187" fill="none" class="thin"/>
      <!-- hood/head -->
      <path d="M-78-112Q0-164 78-112L92-34Q80 36 0 50Q-80 36-92-34Z" fill="#C7DDBF" class="ink"/>
      <path d="M-60-89Q0-122 60-89L67-28Q57 19 0 29Q-57 19-67-28Z" class="skin ink"/>
      <!-- ears/hood ties -->
      <circle cx="-70" cy="-18" r="10" fill="#A7C7A5" class="thin"/><circle cx="70" cy="-18" r="10" fill="#A7C7A5" class="thin"/>
      <!-- face -->
      <ellipse cx="-24" cy="-27" rx="7" ry="10" class="eye"/><ellipse cx="24" cy="-27" rx="7" ry="10" class="eye"/>
      <path d="M-8-2Q0 6 8-2" fill="none" stroke="#1A1F1C" stroke-width="4" stroke-linecap="round"/>
      <!-- torso / short cape -->
      <path d="M-55 53Q0 38 55 53L66 143Q0 173-66 143Z" class="cream ink"/>
      <path d="M-61 56Q0 82 61 56L51 91Q0 76-51 91Z" class="scarf ink"/>
      <!-- arms outside silhouette -->
      <path d="M-55 77Q-88 86-92 115Q-91 131-75 132Q-63 129-54 113" class="cream ink"/>
      <circle cx="-79" cy="131" r="13" class="skin ink"/>
      <path d="M55 77Q86 85 91 108Q91 124 77 128Q64 126 55 110" class="cream ink"/>
      <circle cx="80" cy="128" r="13" class="skin ink"/>
      <!-- diagonal satchel -->
      <path d="M-43 48Q15 90 65 139" fill="none" class="thin"/>
      <rect x="38" y="121" width="58" height="53" rx="13" class="bag ink"/>
      <path d="M48 135H84" class="thin"/>
      <!-- legs/boots -->
      <path d="M-35 145Q-38 185-29 208" fill="none" class="ink"/><path d="M35 145Q38 185 29 208" fill="none" class="ink"/>
      <path d="M-49 205Q-22 198-10 210Q-11 229-45 228Q-57 220-49 205Z" class="boot ink"/>
      <path d="M49 205Q22 198 10 210Q11 229 45 228Q57 220 49 205Z" class="boot ink"/>
      <!-- small route charm -->
      <circle cx="68" cy="155" r="9" class="butter thin"/>
    </g>
    <text x="28" y="578" class="txt" font-size="16" font-weight="700">Botanical MED · Explorer HIGH</text>
    <text x="28" y="606" class="muted" font-size="15">hood + asymmetric sprout + cape/scarf + cross-body satchel + boots</text>
    <text x="28" y="630" class="muted" font-size="15">Warm, observant, prepared to walk.</text>
  </g>

  <!-- MR-B -->
  <g transform="translate(510 130)">
    <rect width="420" height="650" rx="28" class="paper"/>
    <text x="28" y="45" class="label" font-size="23">MR-B · Leafcap Wanderer</text>
    <text x="28" y="74" class="muted" font-size="16">strongest storybook silhouette</text>
    <g transform="translate(210 330)">
      <!-- broad leafcap -->
      <path d="M-108-103Q-63-169-4-150Q42-179 106-114Q76-86 40-83Q3-76-39-84Q-79-86-108-103Z" class="leaf ink"/>
      <path d="M-25-148Q-14-186 18-195Q35-161 17-137Z" class="leaf2 ink"/>
      <path d="M-69-93Q0-131 69-92L74-25Q59 30 0 40Q-59 30-74-25Z" class="skin ink"/>
      <!-- face -->
      <ellipse cx="-23" cy="-31" rx="7" ry="10" class="eye"/><ellipse cx="23" cy="-31" rx="7" ry="10" class="eye"/>
      <path d="M-7-5Q0 1 7-5" fill="none" stroke="#1A1F1C" stroke-width="4" stroke-linecap="round"/>
      <!-- cape/torso -->
      <path d="M-49 43Q0 34 49 43L57 139Q0 165-57 139Z" fill="#E7D3A0" class="ink"/>
      <path d="M-60 49Q0 74 60 49L72 113Q35 88 0 103Q-35 88-72 113Z" fill="#7C9E86" class="ink"/>
      <!-- arms -->
      <path d="M-48 72Q-79 91-82 119" fill="none" class="ink"/><circle cx="-83" cy="132" r="13" class="skin ink"/>
      <path d="M48 72Q79 91 82 119" fill="none" class="ink"/><circle cx="83" cy="132" r="13" class="skin ink"/>
      <!-- backpack shown at side -->
      <path d="M49 78Q84 77 93 105L88 160Q62 172 42 151Z" class="bag ink"/>
      <path d="M52 92Q68 80 85 94" fill="none" class="thin"/>
      <!-- legs -->
      <path d="M-30 143L-26 205" fill="none" class="ink"/><path d="M30 143L26 205" fill="none" class="ink"/>
      <ellipse cx="-30" cy="218" rx="28" ry="15" class="boot ink"/><ellipse cx="30" cy="218" rx="28" ry="15" class="boot ink"/>
      <path d="M-93 117Q-111 108-120 119Q-111 134-94 132Z" class="sky thin"/>
    </g>
    <text x="28" y="578" class="txt" font-size="16" font-weight="700">Botanical HIGH · Explorer MED-HIGH</text>
    <text x="28" y="606" class="muted" font-size="15">wide leafcap + short cape + visible backpack + compact shoes</text>
    <text x="28" y="630" class="muted" font-size="15">Whimsical, curious; guard against fantasy-creature drift.</text>
  </g>

  <!-- MR-C -->
  <g transform="translate(965 130)">
    <rect width="420" height="650" rx="28" class="paper"/>
    <text x="28" y="45" class="label" font-size="23">MR-C · Pocket Gardener</text>
    <text x="28" y="74" class="muted" font-size="16">most neighborhood-human</text>
    <g transform="translate(210 330)">
      <!-- small cap/sprout -->
      <path d="M-18-145Q-31-180-63-175Q-61-145-31-130Z" class="leaf ink"/>
      <path d="M3-147Q22-181 52-168Q45-140 16-130Z" class="leaf2 ink"/>
      <path d="M-63-105Q0-143 63-105L70-30Q58 31 0 42Q-58 31-70-30Z" fill="#D8E6CD" class="ink"/>
      <path d="M-53-87Q0-114 53-87L58-25Q50 16 0 25Q-50 16-58-25Z" class="skin ink"/>
      <ellipse cx="-22" cy="-29" rx="7" ry="10" class="eye"/><ellipse cx="22" cy="-29" rx="7" ry="10" class="eye"/>
      <path d="M-8-3Q0 4 8-3" fill="none" stroke="#1A1F1C" stroke-width="4" stroke-linecap="round"/>
      <!-- field coat -->
      <path d="M-52 44Q0 34 52 44L61 154Q0 180-61 154Z" fill="#E8D9AE" class="ink"/>
      <path d="M0 47V158" class="thin"/>
      <path d="M-48 58Q0 76 48 58L42 84Q0 74-42 84Z" class="scarf ink"/>
      <rect x="-33" y="91" width="25" height="22" rx="5" fill="#F7F3E8" class="thin"/><rect x="8" y="91" width="25" height="22" rx="5" fill="#F7F3E8" class="thin"/>
      <!-- clear arms -->
      <path d="M-52 67Q-81 80-89 111Q-90 130-74 134" fill="none" class="ink"/><circle cx="-72" cy="137" r="13" class="skin ink"/>
      <path d="M52 67Q81 80 89 111Q90 130 74 134" fill="none" class="ink"/><circle cx="72" cy="137" r="13" class="skin ink"/>
      <!-- side pouch and specimen -->
      <path d="M-34 50Q24 83 63 137" fill="none" class="thin"/>
      <rect x="42" y="124" width="52" height="47" rx="12" class="bag ink"/>
      <path d="M72 125Q84 105 98 108Q95 126 80 135Z" class="leaf2 thin"/>
      <!-- legs/shoes -->
      <path d="M-28 158L-25 211" fill="none" class="ink"/><path d="M28 158L25 211" fill="none" class="ink"/>
      <path d="M-46 208Q-21 200-8 212Q-10 229-42 229Q-54 220-46 208Z" class="boot ink"/>
      <path d="M46 208Q21 200 8 212Q10 229 42 229Q54 220 46 208Z" class="boot ink"/>
    </g>
    <text x="28" y="578" class="txt" font-size="16" font-weight="700">Botanical LOW-MED · Explorer HIGHEST</text>
    <text x="28" y="606" class="muted" font-size="15">sprout cap + field coat + scarf + side pouch + specimen leaf</text>
    <text x="28" y="630" class="muted" font-size="15">Friendly and grounded; guard against generic child-character drift.</text>
  </g>

  <!-- compact QA strip -->
  <g transform="translate(55 810)">
    <rect width="1330" height="78" rx="22" fill="#F7F3E8" stroke="#D8D3C3" stroke-width="2"/>
    <text x="24" y="31" class="label" font-size="18">Review rule</text>
    <text x="24" y="57" class="muted" font-size="15">First decision is silhouette family only. Do not approve motion, affinity cosmetics or production promotion until one family survives 48dp silhouette + six-expression fit.</text>
    <g transform="translate(1070 39)">
      <circle cx="0" cy="0" r="24" class="dash"/><path d="M-9-10Q0-20 9-10L12 5Q0 16-12 5Z" fill="#A7C7A5" stroke="#214F3B" stroke-width="2"/>
      <circle cx="70" cy="0" r="24" class="dash"/><path d="M52-8Q70-21 88-8L83 8Q70 16 57 8Z" fill="#6B8F7A" stroke="#214F3B" stroke-width="2"/>
      <circle cx="140" cy="0" r="24" class="dash"/><path d="M132-14Q140-27 148-14L153 10Q140 18 127 10Z" fill="#D8E6CD" stroke="#214F3B" stroke-width="2"/>
      <text x="-12" y="35" class="muted" font-size="11">A</text><text x="58" y="35" class="muted" font-size="11">B</text><text x="128" y="35" class="muted" font-size="11">C</text>
    </g>
  </g>
</svg>