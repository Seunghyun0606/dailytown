<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="980" viewBox="0 0 1440 980">
  <title>Daily Town Moru A-2 vector source master v1</title>
  <desc>Approved-direction editable source master for canonical geometry, six expressions, three lighting families, and usage-context crops. Not a runtime asset.</desc>
  <defs>
    <style>
      .ink{stroke:#214F3B;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
      .thin{stroke:#214F3B;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
      .paper{fill:#F7F3E8}.body{fill:#F3D7A6}.bodyLight{fill:#F8E5BF}.bodyDusk{fill:#EBC28F}.bodyDark{fill:#B98E67}
      .leaf{fill:#6B8F7A}.leafLight{fill:#7FA48B}.leafDusk{fill:#71896D}.leafDark{fill:#57736D}
      .scarf{fill:#6B8F7A}.scarfDusk{fill:#7A775C}.scarfDark{fill:#405F59}.bag{fill:#8D6A43}.bagDark{fill:#5B493D}
      .cheek{fill:#F1A68A}.eye{fill:#1A1F1C}.mouth{fill:none;stroke:#1A1F1C;stroke-width:4;stroke-linecap:round}
      .label{font-family:sans-serif;font-size:18px;fill:#1A1F1C}.small{font-family:sans-serif;font-size:14px;fill:#66756D}
    </style>
    <g id="moru-body-light">
      <path class="bodyLight ink" d="M0-92C55-92 88-50 84 8C80 67 48 105 0 105C-48 105-80 67-84 8C-88-50-55-92 0-92Z"/>
      <path class="leafLight ink" d="M-8-100C-47-113-62-149-49-178C-14-176 11-150 7-116Z"/>
      <path class="leaf ink" d="M8-103C45-119 72-103 81-72C50-54 18-65 4-91Z" transform="rotate(-38 8 -103)"/>
      <path class="scarf ink" d="M-58 18C-27 5 25 3 58 18L47 47C18 39-17 39-47 47Z"/>
      <path class="bag ink" d="M49 28C74 26 88 44 84 71C80 92 61 100 43 90L42 44Z"/>
      <path class="thin" fill="none" d="M47 34C56 3 71-8 82-17"/>
      <ellipse cx="-32" cy="68" rx="18" ry="11" class="bodyLight ink"/><ellipse cx="32" cy="68" rx="18" ry="11" class="bodyLight ink"/>
      <ellipse cx="-26" cy="108" rx="22" ry="12" fill="#8D6A43" class="ink"/><ellipse cx="26" cy="108" rx="22" ry="12" fill="#8D6A43" class="ink"/>
    </g>
    <g id="moru-body-dusk">
      <path class="bodyDusk ink" d="M0-92C55-92 88-50 84 8C80 67 48 105 0 105C-48 105-80 67-84 8C-88-50-55-92 0-92Z"/>
      <path class="leafDusk ink" d="M-8-100C-47-113-62-149-49-178C-14-176 11-150 7-116Z"/>
      <path class="leafDusk ink" d="M8-103C45-119 72-103 81-72C50-54 18-65 4-91Z" transform="rotate(-38 8 -103)"/>
      <path class="scarfDusk ink" d="M-58 18C-27 5 25 3 58 18L47 47C18 39-17 39-47 47Z"/>
      <path class="bag ink" d="M49 28C74 26 88 44 84 71C80 92 61 100 43 90L42 44Z"/>
      <path class="thin" fill="none" d="M47 34C56 3 71-8 82-17"/>
      <ellipse cx="-32" cy="68" rx="18" ry="11" class="bodyDusk ink"/><ellipse cx="32" cy="68" rx="18" ry="11" class="bodyDusk ink"/>
      <ellipse cx="-26" cy="108" rx="22" ry="12" fill="#8D6A43" class="ink"/><ellipse cx="26" cy="108" rx="22" ry="12" fill="#8D6A43" class="ink"/>
    </g>
    <g id="moru-body-dark">
      <path class="bodyDark ink" d="M0-92C55-92 88-50 84 8C80 67 48 105 0 105C-48 105-80 67-84 8C-88-50-55-92 0-92Z"/>
      <path class="leafDark ink" d="M-8-100C-47-113-62-149-49-178C-14-176 11-150 7-116Z"/>
      <path class="leafDark ink" d="M8-103C45-119 72-103 81-72C50-54 18-65 4-91Z" transform="rotate(-38 8 -103)"/>
      <path class="scarfDark ink" d="M-58 18C-27 5 25 3 58 18L47 47C18 39-17 39-47 47Z"/>
      <path class="bagDark ink" d="M49 28C74 26 88 44 84 71C80 92 61 100 43 90L42 44Z"/>
      <path class="thin" fill="none" d="M47 34C56 3 71-8 82-17"/>
      <ellipse cx="-32" cy="68" rx="18" ry="11" class="bodyDark ink"/><ellipse cx="32" cy="68" rx="18" ry="11" class="bodyDark ink"/>
      <ellipse cx="-26" cy="108" rx="22" ry="12" fill="#5B493D" class="ink"/><ellipse cx="26" cy="108" rx="22" ry="12" fill="#5B493D" class="ink"/>
    </g>
    <g id="face-neutral"><ellipse cx="-25" cy="-18" rx="8" ry="11" class="eye"/><ellipse cx="25" cy="-18" rx="8" ry="11" class="eye"/><circle cx="-47" cy="2" r="8" class="cheek" opacity=".7"/><circle cx="47" cy="2" r="8" class="cheek" opacity=".7"/><path class="mouth" d="M-7 9Q0 15 7 9"/></g>
    <g id="face-happy"><path class="mouth" d="M-35-18Q-25-29-15-18M15-18Q25-29 35-18"/><circle cx="-47" cy="2" r="9" class="cheek"/><circle cx="47" cy="2" r="9" class="cheek"/><path class="mouth" d="M-15 6Q0 25 15 6"/></g>
    <g id="face-curious"><ellipse cx="-25" cy="-20" rx="8" ry="12" class="eye"/><ellipse cx="25" cy="-15" rx="8" ry="11" class="eye"/><circle cx="-47" cy="2" r="7" class="cheek" opacity=".6"/><circle cx="47" cy="2" r="7" class="cheek" opacity=".6"/><path class="mouth" d="M-3 9Q3 6 8 10"/><path d="M49-38Q61-49 70-36" fill="none" class="thin"/><circle cx="70" cy="-31" r="3" fill="#214F3B"/></g>
    <g id="face-surprised"><ellipse cx="-25" cy="-20" rx="10" ry="14" class="eye"/><ellipse cx="25" cy="-20" rx="10" ry="14" class="eye"/><circle cx="-47" cy="4" r="8" class="cheek" opacity=".8"/><circle cx="47" cy="4" r="8" class="cheek" opacity=".8"/><ellipse cx="0" cy="11" rx="8" ry="11" fill="#1A1F1C"/><path d="M55-45L55-63M55-72L55-76" class="thin" fill="none"/></g>
    <g id="face-clue"><ellipse cx="-25" cy="-20" rx="8" ry="11" class="eye"/><ellipse cx="25" cy="-20" rx="8" ry="11" class="eye"/><circle cx="-47" cy="2" r="7" class="cheek" opacity=".7"/><circle cx="47" cy="2" r="7" class="cheek" opacity=".7"/><path class="mouth" d="M-10 10Q0 18 10 8"/><circle cx="61" cy="-28" r="15" fill="none" class="thin"/><path d="M72-17L84-5" class="thin"/><circle cx="60" cy="-29" r="4" fill="#FFD36B"/></g>
    <g id="face-resolved"><path class="mouth" d="M-34-18Q-25-25-16-18M16-18Q25-25 34-18"/><circle cx="-47" cy="2" r="8" class="cheek" opacity=".8"/><circle cx="47" cy="2" r="8" class="cheek" opacity=".8"/><path class="mouth" d="M-11 7Q0 18 11 7"/><path d="M50-47L54-36L65-33L55-27L58-16L49-22L40-16L43-27L33-33L45-36Z" fill="#FFD36B" stroke="#214F3B" stroke-width="2"/></g>
    <g id="moru-neutral-light"><use href="#moru-body-light"/><use href="#face-neutral"/></g>
    <g id="moru-happy-light"><use href="#moru-body-light"/><use href="#face-happy"/></g>
    <g id="moru-curious-light"><use href="#moru-body-light"/><use href="#face-curious"/></g>
    <g id="moru-surprised-light"><use href="#moru-body-light"/><use href="#face-surprised"/></g>
    <g id="moru-clue-light"><use href="#moru-body-light"/><use href="#face-clue"/></g>
    <g id="moru-resolved-light"><use href="#moru-body-light"/><use href="#face-resolved"/></g>
    <g id="moru-neutral-dusk"><use href="#moru-body-dusk"/><use href="#face-neutral"/></g>
    <g id="moru-happy-dusk"><use href="#moru-body-dusk"/><use href="#face-happy"/></g>
    <g id="moru-curious-dusk"><use href="#moru-body-dusk"/><use href="#face-curious"/></g>
    <g id="moru-surprised-dusk"><use href="#moru-body-dusk"/><use href="#face-surprised"/></g>
    <g id="moru-clue-dusk"><use href="#moru-body-dusk"/><use href="#face-clue"/></g>
    <g id="moru-resolved-dusk"><use href="#moru-body-dusk"/><use href="#face-resolved"/></g>
    <g id="moru-neutral-dark"><use href="#moru-body-dark"/><use href="#face-neutral"/></g>
    <g id="moru-happy-dark"><use href="#moru-body-dark"/><use href="#face-happy"/></g>
    <g id="moru-curious-dark"><use href="#moru-body-dark"/><use href="#face-curious"/></g>
    <g id="moru-surprised-dark"><use href="#moru-body-dark"/><use href="#face-surprised"/></g>
    <g id="moru-clue-dark"><use href="#moru-body-dark"/><use href="#face-clue"/></g>
    <g id="moru-resolved-dark"><use href="#moru-body-dark"/><use href="#face-resolved"/></g>
  </defs>
  <rect width="1440" height="980" rx="28" fill="#EEF3F5"/>
  <text x="36" y="44" class="label" font-size="28">Moru A-2 vector source master v1 — canonical + expression + lighting</text>
  <text x="36" y="74" class="small">Canonical anatomy is shared by every state; semantic expression and lighting are independent selectors.</text>

  <g transform="translate(155 335) scale(1.15)"><use href="#moru-neutral-light"/></g>
  <text x="70" y="570" class="label">Canonical LIGHT / neutral</text>
  <text x="70" y="598" class="small">Head/body/feet proportions are locked. Scarf, bag and detail slots are replaceable.</text>

  <g id="expression-light-row" transform="translate(430 235)">
    <g transform="translate(0 0) scale(.48)"><use href="#moru-neutral-light"/></g><g transform="translate(150 0) scale(.48)"><use href="#moru-happy-light"/></g><g transform="translate(300 0) scale(.48)"><use href="#moru-curious-light"/></g><g transform="translate(450 0) scale(.48)"><use href="#moru-surprised-light"/></g><g transform="translate(600 0) scale(.48)"><use href="#moru-clue-light"/></g><g transform="translate(750 0) scale(.48)"><use href="#moru-resolved-light"/></g>
  </g>
  <text x="415" y="112" class="label">LIGHT</text><text x="422" y="398" class="small">neutral</text><text x="565" y="398" class="small">happy</text><text x="712" y="398" class="small">curious</text><text x="850" y="398" class="small">surprised</text><text x="997" y="398" class="small">clue_found</text><text x="1145" y="398" class="small">resolved</text>

  <g id="expression-dusk-row" transform="translate(430 535)">
    <g transform="translate(0 0) scale(.48)"><use href="#moru-neutral-dusk"/></g><g transform="translate(150 0) scale(.48)"><use href="#moru-happy-dusk"/></g><g transform="translate(300 0) scale(.48)"><use href="#moru-curious-dusk"/></g><g transform="translate(450 0) scale(.48)"><use href="#moru-surprised-dusk"/></g><g transform="translate(600 0) scale(.48)"><use href="#moru-clue-dusk"/></g><g transform="translate(750 0) scale(.48)"><use href="#moru-resolved-dusk"/></g>
  </g>
  <text x="350" y="522" class="label">WARM_DUSK</text>

  <rect x="380" y="670" width="950" height="260" rx="24" fill="#1E2A44"/>
  <g id="expression-dark-row" transform="translate(430 810)">
    <g transform="translate(0 0) scale(.42)"><use href="#moru-neutral-dark"/></g><g transform="translate(150 0) scale(.42)"><use href="#moru-happy-dark"/></g><g transform="translate(300 0) scale(.42)"><use href="#moru-curious-dark"/></g><g transform="translate(450 0) scale(.42)"><use href="#moru-surprised-dark"/></g><g transform="translate(600 0) scale(.42)"><use href="#moru-clue-dark"/></g><g transform="translate(750 0) scale(.42)"><use href="#moru-resolved-dark"/></g>
  </g>
  <text x="402" y="706" font-family="sans-serif" font-size="18" fill="#F7FAF5">DARK — face remains readable without neon treatment</text>

  <g id="usage-context-guides" transform="translate(58 655)">
    <rect x="0" y="0" width="84" height="84" rx="18" fill="#FFFDF7" stroke="#D8D3C3" stroke-width="2"/><g transform="translate(42 52) scale(.22)"><use href="#moru-neutral-light"/></g><text x="0" y="110" class="small">map_avatar</text>
    <rect x="105" y="0" width="110" height="110" rx="55" fill="#FFFDF7" stroke="#6B8F7A" stroke-width="3"/><g transform="translate(160 70) scale(.28)"><use href="#moru-happy-light"/></g><text x="116" y="136" class="small">hud_portrait</text>
    <rect x="240" y="0" width="150" height="160" rx="18" fill="#FFFDF7" stroke="#D8D3C3" stroke-width="2"/><g transform="translate(315 105) scale(.43)"><use href="#moru-curious-light"/></g><text x="260" y="188" class="small">encounter_halfbody</text>
  </g>
  <text x="36" y="950" class="small">Source master only. Individual transparent derivatives must be exported, QA-checked, checksummed and promoted before runtime use.</text>
</svg>