<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760">
  <title>Daily Town A-3 reusable UI asset source master v1</title>
  <defs>
    <pattern id="lockedPattern" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="12" height="12" fill="#EEF3F5"/><rect width="5" height="12" fill="#D8D3C3"/></pattern>
    <filter id="paperShadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#8B7B5D" flood-opacity="0.16"/></filter>
    <style>
      .ink{fill:#1A1F1C}.muted{fill:#66756D}.line{stroke:#D8D3C3;stroke-width:2}.paper{fill:#F7F3E8;stroke:#D8D3C3;stroke-width:2}.raised{fill:#FFFDF7;stroke:#D8D3C3;stroke-width:2}.leaf{fill:#6B8F7A;stroke:#214F3B;stroke-width:3}.accent{fill:#FFD36B;stroke:#214F3B;stroke-width:3}.peach{fill:#FFB184;stroke:#214F3B;stroke-width:3}.txt{font-family:sans-serif;font-size:18px;fill:#1A1F1C}.small{font-family:sans-serif;font-size:14px;fill:#66756D}
    </style>
  </defs>
  <rect width="1200" height="760" rx="28" fill="#EEF3F5"/>
  <text x="36" y="46" class="txt" font-size="27">A-3 storybook/paper source master v1 — reusable approved-source primitives</text>
  <text x="36" y="78" class="small">Stable across time-of-day; state is never conveyed by hue alone; texture is suppressed behind dense copy.</text>

  <g id="surface.journal.paper" transform="translate(50 120)" filter="url(#paperShadow)">
    <rect width="220" height="280" rx="22" class="paper"/>
    <circle cx="18" cy="18" r="3" fill="#A7C7A5"/><circle cx="202" cy="260" r="3" fill="#FFD36B"/>
    <line x1="28" y1="70" x2="192" y2="70" class="line"/><line x1="28" y1="108" x2="192" y2="108" class="line"/><line x1="28" y1="146" x2="192" y2="146" class="line"/><line x1="28" y1="184" x2="192" y2="184" class="line"/>
    <text x="24" y="38" class="small">surface.journal.paper</text>
  </g>

  <g id="surface.collection.paper" transform="translate(310 120)" filter="url(#paperShadow)">
    <rect width="220" height="280" rx="22" class="raised"/>
    <text x="24" y="38" class="small">surface.collection.paper</text>
    <rect x="24" y="70" width="76" height="76" rx="14" class="paper"/><rect x="120" y="70" width="76" height="76" rx="14" class="paper"/><rect x="24" y="166" width="76" height="76" rx="14" fill="url(#lockedPattern)" stroke="#D8D3C3" stroke-width="2"/><rect x="120" y="166" width="76" height="76" rx="14" class="paper"/>
  </g>

  <g id="surface.memory.paper" transform="translate(570 120)" filter="url(#paperShadow)">
    <rect width="260" height="280" rx="22" class="paper"/>
    <text x="24" y="38" class="small">surface.memory.paper</text>
    <rect x="24" y="62" width="212" height="126" rx="18" fill="#E8F2E5" stroke="#D8D3C3" stroke-width="2"/>
    <circle cx="76" cy="120" r="26" fill="#A7C7A5"/><path d="M74 136C70 111 84 94 105 92C108 116 96 133 74 136Z" class="leaf"/>
    <line x1="28" y1="216" x2="230" y2="216" class="line"/><line x1="28" y1="246" x2="190" y2="246" class="line"/>
  </g>

  <g id="sticker.discovery.default" transform="translate(900 155)">
    <path d="M0-58C35-58 62-34 62 0S35 58 0 58S-62 34-62 0S-35-58 0-58Z" fill="#FFFDF7" stroke="#214F3B" stroke-width="4" stroke-dasharray="7 5"/>
    <path d="M-20 16C-20-12 5-30 31-25C29 4 13 23-15 27Z" class="leaf"/>
    <path d="M-13 21L18-13" stroke="#214F3B" stroke-width="4" stroke-linecap="round"/>
    <circle cx="26" cy="-28" r="8" class="accent"/>
  </g>
  <text x="844" y="248" class="small">sticker.discovery.default</text>

  <g id="card.clue.unresolved" transform="translate(50 455)" filter="url(#paperShadow)">
    <rect width="250" height="190" rx="20" class="raised"/>
    <rect x="18" y="18" width="214" height="40" rx="12" fill="#EEF3F5"/>
    <text x="34" y="44" class="small">card.clue.unresolved</text>
    <circle cx="64" cy="110" r="30" fill="#F4F0E6" stroke="#D8D3C3" stroke-width="2"/>
    <text x="55" y="122" class="txt" font-size="34">?</text>
    <line x1="112" y1="92" x2="210" y2="92" class="line"/><line x1="112" y1="120" x2="196" y2="120" class="line"/>
    <rect x="18" y="160" width="86" height="18" rx="9" fill="url(#lockedPattern)"/>
  </g>

  <g id="card.clue.resolved" transform="translate(330 455)" filter="url(#paperShadow)">
    <rect width="250" height="190" rx="20" class="raised"/>
    <rect x="18" y="18" width="214" height="40" rx="12" fill="#E8F2E5"/>
    <text x="34" y="44" class="small">card.clue.resolved</text>
    <circle cx="64" cy="110" r="30" fill="#F7F3E8" stroke="#48836C" stroke-width="3"/>
    <path d="M48 111L59 122L81 96" fill="none" stroke="#48836C" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="112" y1="92" x2="210" y2="92" class="line"/><line x1="112" y1="120" x2="196" y2="120" class="line"/>
    <rect x="18" y="160" width="86" height="18" rx="9" fill="#A7C7A5"/>
  </g>

  <g id="stamp.companion.default" transform="translate(685 550)">
    <circle r="68" fill="#FFFDF7" stroke="#214F3B" stroke-width="4" stroke-dasharray="6 5"/>
    <circle r="52" fill="#F7F3E8" stroke="#D8D3C3" stroke-width="2"/>
    <path d="M-24 14C-24-14 2-32 30-27C27 2 11 24-18 27Z" class="leaf"/>
    <circle cx="27" cy="-30" r="8" class="accent"/>
  </g>
  <text x="618" y="638" class="small">stamp.companion.default</text>

  <g id="stamp.memory.resolved" transform="translate(880 550)">
    <circle r="62" fill="#FFFDF7" stroke="#E8794F" stroke-width="4"/>
    <circle r="47" fill="#F7F3E8" stroke="#FFB184" stroke-width="3" stroke-dasharray="5 4"/>
    <path d="M0-25L8-8L27-5L13 8L17 28L0 18L-17 28L-13 8L-27-5L-8-8Z" fill="#FFD36B" stroke="#214F3B" stroke-width="3"/>
  </g>
  <text x="814" y="638" class="small">stamp.memory.resolved</text>

  <g id="collection.locked.pattern" transform="translate(1020 520)">
    <rect width="130" height="130" rx="20" fill="url(#lockedPattern)" stroke="#D8D3C3" stroke-width="2"/>
    <rect x="42" y="58" width="46" height="38" rx="8" fill="#F7F3E8" stroke="#66756D" stroke-width="3"/>
    <path d="M52 58V46C52 29 78 29 78 46V58" fill="none" stroke="#66756D" stroke-width="3"/>
  </g>
  <text x="1000" y="674" class="small">collection.locked.pattern</text>

  <text x="36" y="724" class="small">Source master only. Exported runtime derivatives must remove labels, QA guides and non-semantic decoration as appropriate.</text>
</svg>