name: Moru neutral PASS stale-doc cleanup one-shot
on:
  push:
    branches:
      - design/production-consolidated-v2
permissions:
  contents: write
jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove stale current-state blocker wording
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('docs/design/PRODUCTION_WORK_ITEMS_V2.md')
          s=p.read_text()
          s=s.replace(
            '- the human/layered raster reconstruction package is ready under `design/reference/moru-v2/native-master-handoff-v1/`; no large-context asset was regenerated\n- `encounter_halfbody`, `result_large`, and final `companion_portrait` require native same-design raster reproduction rather than simple upscaling\n- this is a source-resolution/clean-transparency blocker, not a design-direction blocker',
            '- the reconstruction handoff under `design/reference/moru-v2/native-master-handoff-v1/` is retained as provenance/acceptance evidence; the accepted neutral master now lives under `design/reference/moru-v2/native-master-v1/`\n- `encounter_halfbody`, `result_large`, and final `companion_portrait` must now be derived from the accepted native neutral master and validated in MORU-02; board-crop upscaling remains forbidden\n- the neutral source-resolution/clean-transparency blocker is closed; the remaining blocker is the native usage-context family plus MORU-02 QA'
          )
          p.write_text(s)
          PY
      - name: Commit cleanup and remove workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "AI Remote Work"
          git config user.email "ai-remote@local.invalid"
          git rm .github/workflows/moru-native-master-doc-cleanup-once.yml
          git add docs/design/PRODUCTION_WORK_ITEMS_V2.md
          git commit -m "docs: remove stale Moru neutral blocker wording"
          git push origin HEAD:design/production-consolidated-v2
