name: Moru MORU-02 usage remote verification one-shot

on:
  push:
    branches:
      - design/production-consolidated-v2
    paths:
      - '.github/workflows/moru-moru02-remote-verify-once.yml'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install verification dependency
        run: python -m pip install --disable-pip-version-check pillow
      - name: Reverify persisted usage-context binaries
        run: python3 scripts/moru_moru02_remote_verify_once.py
      - name: Persist verification and remove one-shot verifier
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "AI Remote Work"
          git config user.email "ai-remote@local.invalid"
          git rm .github/workflows/moru-moru02-remote-verify-once.yml scripts/moru_moru02_remote_verify_once.py
          git add design/reference/moru-v2/native-usage-context-v1/qa/remote_binary_verification.v1.json
          git commit -m "qa: verify Moru neutral usage remote binaries"
          git push origin HEAD:design/production-consolidated-v2
