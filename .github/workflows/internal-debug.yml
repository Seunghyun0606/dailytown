name: Internal Debug APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 15859902
          packages: platform-tools
      - name: Install Android SDK 37
        run: sdkmanager "platforms;android-37.0" "build-tools;37.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"
      - name: Verify NAVER credential secret
        env:
          NAVER_MAP_NCP_KEY_ID: ${{ secrets.NAVER_MAP_NCP_KEY_ID }}
        run: |
          if [ -z "$NAVER_MAP_NCP_KEY_ID" ]; then
            echo "::error::Repository secret NAVER_MAP_NCP_KEY_ID is required for a credentialed internal APK."
            exit 1
          fi
      - name: Unit tests
        run: gradle testDebugUnitTest
      - name: Build credentialed debug APK
        env:
          NAVER_MAP_NCP_KEY_ID: ${{ secrets.NAVER_MAP_NCP_KEY_ID }}
        run: gradle assembleDebug
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: dailytown-internal-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
