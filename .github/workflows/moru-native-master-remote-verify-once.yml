name: Moru native neutral remote binary verification one-shot
on:
  push:
    branches:
      - design/production-consolidated-v2
permissions:
  contents: write
jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify Git checkout binary bytes
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib,json,struct,subprocess,zipfile
          from pathlib import Path
          root=Path.cwd()
          base=root/'design/reference/moru-v2/native-master-v1'
          manifest=json.loads((base/'manifest.native-neutral.v1.json').read_text())
          expected_canonical='541b53464bbc589d86323faa3a7dbc8790cf9ab9573e0dd66812986c4a430500'
          def sha(p):
              h=hashlib.sha256()
              with open(p,'rb') as f:
                  for b in iter(lambda:f.read(1048576),b''): h.update(b)
              return h.hexdigest()
          def blob(p):
              return subprocess.check_output(['git','hash-object',str(p)],text=True).strip()
          def introduced(p):
              return subprocess.check_output(['git','log','-1','--format=%H','--',str(p.relative_to(root))],text=True).strip()
          canonical=root/'design/reference/baseline-v2/moru_candidate3_canonical_baseline_v2.png'
          if sha(canonical)!=expected_canonical: raise SystemExit('CANONICAL_REMOTE_HASH_MISMATCH')
          out={}
          for role in ('png','ora','qa'):
              spec=manifest['outputs'][role]
              p=base/spec['path']
              actual=sha(p)
              if actual!=spec['sha256']: raise SystemExit(f'{role.upper()}_REMOTE_HASH_MISMATCH expected={spec["sha256"]} actual={actual}')
              out[role]={'path':str(p.relative_to(root)),'sha256':actual,'git_blob_sha1':blob(p),'bytes':p.stat().st_size,'introduced_commit':introduced(p)}
          png=base/manifest['outputs']['png']['path']
          with open(png,'rb') as f:
              sig=f.read(8); length=struct.unpack('>I',f.read(4))[0]; kind=f.read(4); ihdr=f.read(length)
          if sig!=b'\x89PNG\r\n\x1a\n' or kind!=b'IHDR': raise SystemExit('PNG_HEADER_INVALID')
          w,h,depth,color,comp,filt,interlace=struct.unpack('>IIBBBBB',ihdr)
          if (w,h,depth,color)!=(1280,1600,8,6): raise SystemExit(f'PNG_METADATA_MISMATCH {(w,h,depth,color)}')
          ora=base/manifest['outputs']['ora']['path']
          with zipfile.ZipFile(ora) as z:
              if z.testzip() is not None: raise SystemExit('ORA_ZIP_INTEGRITY_FAIL')
              if z.read('mimetype')!=b'image/openraster': raise SystemExit('ORA_MIMETYPE_FAIL')
              layer_files=[n for n in z.namelist() if n.startswith('data/') and n.endswith('.png')]
              if len(layer_files)!=manifest['outputs']['ora']['layers']: raise SystemExit('ORA_LAYER_COUNT_FAIL')
          rec={'version':'moru-native-neutral-remote-verification-v1-2026-09-14','status':'PASS_REMOTE_BINARY_REVERIFY','remote_checkout_commit':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),'branch':'design/production-consolidated-v2','canonical_sha256':sha(canonical),'png_metadata':{'width':w,'height':h,'bit_depth':depth,'png_color_type':color,'mode':'RGBA'},'ora_integrity':{'zip_test':'PASS','mimetype':'image/openraster','layer_files':len(layer_files)},'outputs':out}
          q=base/'qa/remote_binary_verification.v1.json'
          q.write_text(json.dumps(rec,indent=2)+'\n')
          print(json.dumps(rec,indent=2))
          PY
      - name: Persist verification and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "AI Remote Work"
          git config user.email "ai-remote@local.invalid"
          git rm .github/workflows/moru-native-master-remote-verify-once.yml
          git add design/reference/moru-v2/native-master-v1/qa/remote_binary_verification.v1.json
          git commit -m "qa: verify Moru neutral master remote binaries"
          git push origin HEAD:design/production-consolidated-v2
