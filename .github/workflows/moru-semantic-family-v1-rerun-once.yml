name: Moru semantic family v1 corrected rerun

on:
  push:
    branches:
      - design/production-consolidated-v2
    paths:
      - .github/workflows/moru-semantic-family-v1-rerun-once.yml

permissions:
  contents: write

jobs:
  semantic-family:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: design/production-consolidated-v2
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deterministic image dependencies
        run: python -m pip install --disable-pip-version-check --no-cache-dir numpy pillow scipy

      - name: Restore staged runner and patch implementation-only framing call
        shell: bash
        run: |
          set -euo pipefail
          git show 2ad5aea76347cf5cc43bc3282051bd47b2b2b4c9:scripts/moru_moru02_semantic_family_v1_once.py > /tmp/moru_moru02_semantic_family_v1_once.py
          python - <<'PY'
          from pathlib import Path
          p=Path('/tmp/moru_moru02_semantic_family_v1_once.py')
          s=p.read_text()
          old='    return fit_usage(src, sub, *specs[usage])\n'
          new='    target, fr, fill, anchor = specs[usage]\n    return fit_usage(src, sub, fr, target, fill, anchor)\n'
          if old not in s:
              raise SystemExit('EXPECTED_FRAMING_CALL_NOT_FOUND')
          p.write_text(s.replace(old,new,1))
          PY

      - name: Run corrected semantic family authoring and QA
        id: semantic
        shell: bash
        run: |
          set +e
          python /tmp/moru_moru02_semantic_family_v1_once.py 2>&1 | tee /tmp/moru-semantic-family-v1.log
          code=${PIPESTATUS[0]}
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Commit accepted semantic family only
        if: steps.semantic.outputs.exit_code == '0'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "AI Remote Work"
          git config user.email "ai-remote@local.invalid"
          rm -f design/reference/moru-v2/native-semantic-family-v1/qa/FAILURE_MORU_02_SEMANTIC_FAMILY_V1.md
          git add -A design/reference/moru-v2/native-semantic-family-v1 \
                     design/export-spec/moru-production-manifest.v2.json \
                     design/reference/moru-v2/manifest.json
          if ! git diff --cached --quiet; then
            git commit -m "design: pass Moru semantic family v1"
            git push origin HEAD:design/production-consolidated-v2
          fi

      - name: Refresh failure evidence only
        if: steps.semantic.outputs.exit_code != '0'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "AI Remote Work"
          git config user.email "ai-remote@local.invalid"
          mkdir -p design/reference/moru-v2/native-semantic-family-v1/qa
          {
            echo "# FAIL_MORU_02_SEMANTIC_FAMILY_V1"
            echo
            echo "- rerun workflow commit: $GITHUB_SHA"
            echo "- exit code: ${{ steps.semantic.outputs.exit_code }}"
            echo "- rejected production binaries persisted: false"
            echo "- framing call implementation bug from prior run: corrected"
            echo
            echo '```text'
            tail -n 120 /tmp/moru-semantic-family-v1.log
            echo '```'
          } > design/reference/moru-v2/native-semantic-family-v1/qa/FAILURE_MORU_02_SEMANTIC_FAMILY_V1.md
          git add design/reference/moru-v2/native-semantic-family-v1/qa/FAILURE_MORU_02_SEMANTIC_FAMILY_V1.md
          if ! git diff --cached --quiet; then
            git commit -m "docs: refresh Moru semantic family v1 failure"
            git push origin HEAD:design/production-consolidated-v2
          fi

      - name: Remove corrected one-shot workflow
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "AI Remote Work"
          git config user.email "ai-remote@local.invalid"
          git pull --rebase origin design/production-consolidated-v2
          rm -f .github/workflows/moru-semantic-family-v1-rerun-once.yml
          git add -A .github/workflows/moru-semantic-family-v1-rerun-once.yml
          if ! git diff --cached --quiet; then
            git commit -m "chore: remove corrected Moru semantic rerun workflow"
            git push origin HEAD:design/production-consolidated-v2
          fi
