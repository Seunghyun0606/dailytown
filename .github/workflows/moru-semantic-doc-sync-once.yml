name: Moru semantic PASS docs sync once

on:
  push:
    branches:
      - design/production-consolidated-v2
    paths:
      - .github/workflows/moru-semantic-doc-sync-once.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: design/production-consolidated-v2
          fetch-depth: 0
          persist-credentials: true

      - name: Sync MORU-02 PASS and MORU-03 readiness docs
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p=Path(path); s=p.read_text()
              if s.count(old)!=1:
                  raise SystemExit(f'REPLACE_COUNT_MISMATCH {path}: {s.count(old)} for {old[:80]!r}')
              p.write_text(s.replace(old,new,1))

          work='docs/design/PRODUCTION_WORK_ITEMS_V2.md'
          replace_once(work,
            'Status: **IN PROGRESS — native neutral + neutral usage + LIGHT/WARM_DUSK/DARK lighting family PASS; expression/affinity authoring pending; not activated**',
            'Status: **DONE — native neutral, usage, lighting and semantic source family PASS; runtime not activated**')
          replace_once(work,
            '- the neutral source-resolution/clean-transparency blocker, neutral usage-context/mobile-edge baseline, and LIGHT/WARM_DUSK/DARK lighting family are closed; remaining MORU-02 work is expression/affinity authoring, consistency and semantic coverage',
            '- the neutral source-resolution/clean-transparency blocker, neutral usage-context/mobile-edge baseline, LIGHT/WARM_DUSK/DARK lighting family, and expression/affinity semantic source family are closed; MORU-02 repository-side semantic/cross-family QA is complete')
          replace_once(work,
            '- do not remake the neutral master, neutral usage family, or accepted lighting family; consume the semantic authoring handoff for five non-neutral expression masters + three restrained affinity overlay stages, then run MORU-02 cross-family/fallback QA before semantic/runtime activation',
            '- 2026-09-14 `PASS_MORU_02_SEMANTIC_FAMILY_V1`: five non-neutral 1280×1600 RGBA expression masters + three restrained 1280×1600 affinity overlays persisted under `design/reference/moru-v2/native-semantic-family-v1/`; expression alpha is bit-identical to neutral, silhouette IoU 1.0, face-anchor deviation 0, changed-outside-allowed pixels 0, and usage/lighting algorithms reproduce their accepted authorities exactly\n- HUD 64dp pairwise expression difference gate PASS (minimum changed fraction `0.00400600901352028`); LIGHT/WARM_DUSK/DARK face readability and all expression×affinity Companion alpha/edge gates PASS\n- semantic family fresh-checkout `PASS_REMOTE_BINARY_REVERIFY`: five expression and three affinity SHA-256 values, dimensions/modes/alpha properties, four QA boards, production manifest state and fallback `neutral/LIGHT/base/static` all match; runtime activation remains false\n- do not remake the neutral, usage, lighting or semantic source families; proceed only to MORU-03 resolver/export activation-readiness checks')
          replace_once(work,
            'Status: **IN PROGRESS — neutral usage/mobile-edge + LIGHT/WARM_DUSK/DARK lighting family PASS; expression/affinity QA pending**',
            'Status: **DONE — PASS_MORU_02_SEMANTIC_FAMILY_V1 + fresh remote binary re-verification PASS; not activated**')
          replace_once(work,
            'The native neutral gate, six-context `neutral / LIGHT / base / static` Android-size/transparent-edge baseline, and deterministic `LIGHT / WARM_DUSK / DARK` lighting family now pass. Evidence is persisted under `design/reference/moru-v2/native-usage-context-v1/` and `design/reference/moru-v2/native-lighting-family-v1/`, both with fresh remote binary re-verification. The earlier reference-derived map/HUD/journal results remain historical evidence only. MORU-02 is **not complete** until the five non-neutral expression masters and familiar/trusted/best_friend affinity overlays are authored from the semantic handoff and cross-family identity/fallback QA passes. Runtime activation remains blocked.',
            'The native neutral gate, six-context Android-size/transparent-edge baseline, deterministic LIGHT/WARM_DUSK/DARK lighting family, five non-neutral expression masters, and familiar/trusted/best_friend restrained affinity overlays now pass. Cross-family Companion alpha/edge invariance, HUD 64dp expression distinction, expression×lighting readability, exact usage/lighting reproduction and fallback `neutral / LIGHT / base / static` all pass. Evidence is persisted under `design/reference/moru-v2/native-semantic-family-v1/` with fresh remote binary re-verification. The earlier reference-derived map/HUD/journal results remain historical evidence only. **MORU-02 is complete.** Runtime activation remains blocked until MORU-03 resolver/export readiness passes.')
          replace_once(work,
            'Status: **BLOCKED by MORU-02**',
            'Status: **READY — MORU-02 PASS; resolver/export activation readiness is the next gate**')
          replace_once(work,
            '2. Keep all accepted authorities unchanged: `design/reference/moru-v2/native-master-v1/`, `design/reference/moru-v2/native-usage-context-v1/`, and `design/reference/moru-v2/native-lighting-family-v1/`.\n3. Consume `design/reference/moru-v2/native-semantic-authoring-handoff-v1/` to author only five non-neutral expression masters + three restrained affinity overlay stages, then finish MORU-02 cross-family/fallback QA before MORU-03 semantic activation readiness.\n4. Keep physical-device outdoor readability, M-B final timing/intensity and ID-A icon/logo as Human Gates.',
            '2. Keep all accepted Moru authorities unchanged: `native-master-v1/`, `native-usage-context-v1/`, `native-lighting-family-v1/`, and `native-semantic-family-v1/`; the semantic authoring handoff is consumed provenance only.\n3. Start MORU-03 only: validate semantic resolver/export coverage for 6 expressions × 3 lightings × 4 affinity states × required usage contexts, exact `neutral/LIGHT/base/static` fallback, v1 rollback retention, and no silent runtime profile repoint. Runtime activation itself remains a separate Development gate.\n4. Keep physical-device outdoor readability, M-B final timing/intensity and ID-A icon/logo as Human Gates.')

          suff='docs/design/MORU_SOURCE_SUFFICIENCY_V2.md'
          replace_once(suff,
            '> Status: **AUDITED / NATIVE NEUTRAL MASTER V1 PASS — native usage-context family / MORU-02 pending**',
            '> Status: **AUDITED / NATIVE SEMANTIC FAMILY V1 PASS — MORU-02 complete / MORU-03 pending**')
          replace_once(suff,
            'The accepted neutral master has now also produced a passing six-context `neutral / LIGHT / base / static` native usage family under `design/reference/moru-v2/native-usage-context-v1/`. The next valid work is the remaining MORU-02 semantic family: expression, lighting and affinity production/consistency QA. Do not regenerate or replace either accepted authority, and do not start semantic/runtime activation before the downstream gates pass.',
            'The accepted neutral master has produced the passing six-context native usage family, the deterministic LIGHT/WARM_DUSK/DARK lighting family, and the accepted native semantic source family under `design/reference/moru-v2/native-semantic-family-v1/`. MORU-02 expression/lighting/affinity production and cross-family QA are complete. Do not regenerate or replace any accepted authority; the next valid work is MORU-03 resolver/export activation readiness, with runtime activation still blocked.')
          replace_once(suff,
            '3. author and validate only the required expression, LIGHT/WARM_DUSK/DARK and affinity variants under the locked Candidate 3 identity;\n4. verify resolver/fallback coverage and semantic invariance;\n5. prepare MORU-03 readiness without silently repointing the legacy profile.',
            '3. keep `design/reference/moru-v2/native-lighting-family-v1/` and `design/reference/moru-v2/native-semantic-family-v1/` immutable as the accepted lighting/semantic authorities;\n4. in MORU-03 verify resolver/export coverage and exact fallback while retaining the legacy v1 rollback pack;\n5. prepare activation readiness without silently repointing the legacy runtime profile.')
          p=Path(suff); s=p.read_text()
          if '## 11. Native semantic family v1 PASS — 2026-09-14' not in s:
              s += '''\n## 11. Native semantic family v1 PASS — 2026-09-14\n\nResult: **PASS_MORU_02_SEMANTIC_FAMILY_V1**.\n\n- Accepted family: `design/reference/moru-v2/native-semantic-family-v1/`; runtime activation remains false.\n- Five new 1280×1600 RGBA LIGHT/base expression masters: `happy`, `curious`, `surprised`, `clue_found`, `resolved`; `neutral` reuses the accepted neutral master.\n- Expression identity locks: alpha bit-identical to neutral, silhouette IoU 1.0, face-anchor deviation 0, changed pixels outside allowed semantic regions 0.\n- Three 1280×1600 restrained affinity overlays: `familiar`, `trusted`, `best_friend`, confined to keepsake/satchel treatment with anatomy invariant.\n- HUD 64dp expression distinction PASS; minimum pairwise changed fraction is `0.00400600901352028`.\n- All six expressions retain readable face statistics across LIGHT/WARM_DUSK/DARK.\n- Cross-family Companion expression×affinity alpha exactness and transparent-edge error `0.0` PASS.\n- Accepted usage fan-out and lighting transfer are reproduced exactly before semantic application, preventing silent algorithm drift.\n- Fresh remote checkout result: **PASS_REMOTE_BINARY_REVERIFY**. All five expression SHA-256 values, three affinity SHA-256 values, dimensions, RGBA/alpha properties, four QA boards, production manifest state and `neutral/LIGHT/base/static` fallback contract match. Evidence: `native-semantic-family-v1/qa/remote_binary_verification.v1.json`.\n- The first workflow run failed only because of an implementation argument-order error in the one-shot runner; no rejected production binaries were persisted. The framing call was corrected without changing any acceptance threshold, and the stale failure note was removed after PASS.\n\nMORU-02 is now **complete**. Next: MORU-03 semantic resolver/export activation readiness only; Android runtime activation remains a separate Development task.\n'''
              p.write_text(s)

          reg='design/reference/REFERENCE_IMAGE_REGISTRY_V2.md'
          p=Path(reg); s=p.read_text()
          marker='| `design/reference/moru-v2/native-semantic-authoring-handoff-v1/qa/moru_semantic_authoring_reference_board_v1.png` | QA/reference board | `60baff5ee79a93a0259b11ef6c0e5724a4e216f50b0f5177253b0e73ecc95a50` | semantic authoring handoff reference; exact expression/affinity crop guide, not a production master |\n'
          rows='''| `design/reference/moru-v2/native-semantic-family-v1/master/companion_moru_v2_result_large_happy_LIGHT_base.png` | 1280×1600 | `b96185d96bf92d5bfc2cea8ce06e82f9e583a4a1543b881caa66206a35ea0187` | `PASS_MORU_02_SEMANTIC_FAMILY_V1`; happy native expression master; alpha identity-locked; not runtime-active |\n| `design/reference/moru-v2/native-semantic-family-v1/master/companion_moru_v2_result_large_curious_LIGHT_base.png` | 1280×1600 | `70daccb16a72f57189e5071b841601e1cbd96425b9d46eb0c021dd121b7b25be` | curious native expression master; alpha identity-locked; not runtime-active |\n| `design/reference/moru-v2/native-semantic-family-v1/master/companion_moru_v2_result_large_surprised_LIGHT_base.png` | 1280×1600 | `ff8ac73cead939f96b7fd3be84df6211d4f4dab8c3d8483554cc7fe7de0e3c79` | surprised native expression master; alpha identity-locked; not runtime-active |\n| `design/reference/moru-v2/native-semantic-family-v1/master/companion_moru_v2_result_large_clue_found_LIGHT_base.png` | 1280×1600 | `6fc559a3a8085c95250fb4a53335c8c58c4544158319e3d799f3188f5c5a09cb` | clue_found native expression master; source-supported botanical clue treatment; not runtime-active |\n| `design/reference/moru-v2/native-semantic-family-v1/master/companion_moru_v2_result_large_resolved_LIGHT_base.png` | 1280×1600 | `a85e30e1782b0371b549c18c470a74f4107b31d43d8c427f4ab5b5f16cf185c3` | resolved native expression master; alpha identity-locked; not runtime-active |\n| `design/reference/moru-v2/native-semantic-family-v1/overlay/companion_moru_v2_affinity_familiar_overlay.png` | 1280×1600 | `92294ff284d74fb0ce79d76c09b8517920f230ba347c7180844d608365f131d6` | familiar restrained affinity keepsake overlay; anatomy invariant |\n| `design/reference/moru-v2/native-semantic-family-v1/overlay/companion_moru_v2_affinity_trusted_overlay.png` | 1280×1600 | `e8bbfc66b1326f1a93304f26299c14767595b64672768d99860be40d061021d2` | trusted restrained affinity keepsake overlay; anatomy invariant |\n| `design/reference/moru-v2/native-semantic-family-v1/overlay/companion_moru_v2_affinity_best_friend_overlay.png` | 1280×1600 | `be1f699b6dc8dc1b244b8bd2b5f642687afdcf6a0b3c51953a041c8ffd356fa9` | best_friend BF-B restrained keepsake cluster overlay; anatomy invariant |\n| `design/reference/moru-v2/native-semantic-family-v1/qa/moru_semantic_expression_hud64_qa_v1.png` | 660×440 QA board | `aef50cc13bf84b2b48077df5125ab90ca4f1c128d298e75b59d2e2a9e6d242c9` | six-expression HUD 64dp distinction QA; minimum pairwise changed fraction 0.004006 |\n| `design/reference/moru-v2/native-semantic-family-v1/qa/moru_semantic_expression_lighting_hud64_qa_v1.png` | 615×1290 QA board | `0bca24ea25159e7cb953d9ebd9fbc7e215e48369e4ddc903ef18f78b8442661f` | expression × LIGHT/WARM_DUSK/DARK HUD readability QA |\n'''
          if rows.splitlines()[0] not in s:
              if marker not in s: raise SystemExit('REGISTRY_INSERT_MARKER_NOT_FOUND')
              s=s.replace(marker, marker+rows, 1)
              p.write_text(s)
          PY
          git diff --check

      - name: Commit documentation sync
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "AI Remote Work"
          git config user.email "ai-remote@local.invalid"
          git add docs/design/PRODUCTION_WORK_ITEMS_V2.md docs/design/MORU_SOURCE_SUFFICIENCY_V2.md design/reference/REFERENCE_IMAGE_REGISTRY_V2.md
          git commit -m "docs: close Moru MORU-02 semantic QA"
          git push origin HEAD:design/production-consolidated-v2

      - name: Remove one-shot doc sync
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "AI Remote Work"
          git config user.email "ai-remote@local.invalid"
          git pull --rebase origin design/production-consolidated-v2
          rm -f .github/workflows/moru-semantic-doc-sync-once.yml
          git add -A .github/workflows/moru-semantic-doc-sync-once.yml
          if ! git diff --cached --quiet; then
            git commit -m "chore: remove Moru semantic doc sync workflow"
            git push origin HEAD:design/production-consolidated-v2
          fi
