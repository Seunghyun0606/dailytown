name: Moru MORU-03 activation readiness once

on:
  push:
    branches:
      - design/production-consolidated-v2
    paths:
      - .github/workflows/moru-moru03-activation-readiness-once.yml

permissions:
  contents: write

jobs:
  readiness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: design/production-consolidated-v2
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deterministic image dependencies
        run: python -m pip install --disable-pip-version-check --no-cache-dir numpy pillow scipy

      - name: Exhaustively dry-run semantic export and resolver coverage
        shell: bash
        run: |
          set -euo pipefail
          git show 2ad5aea76347cf5cc43bc3282051bd47b2b2b4c9:scripts/moru_moru02_semantic_family_v1_once.py > /tmp/moru02_semantic_authority.py
          python - <<'PY'
          from pathlib import Path
          p=Path('/tmp/moru02_semantic_authority.py')
          s=p.read_text()
          old='    return fit_usage(src, sub, *specs[usage])\n'
          new='    target, fr, fill, anchor = specs[usage]\n    return fit_usage(src, sub, fr, target, fill, anchor)\n'
          if old not in s:
              raise SystemExit('HISTORICAL_DERIVE_USAGE_PATCH_TARGET_MISSING')
          p.write_text(s.replace(old,new,1))
          PY

          python - <<'PY'
          from __future__ import annotations
          import hashlib, json, runpy, subprocess
          from pathlib import Path
          import numpy as np
          from PIL import Image

          ROOT=Path.cwd()
          FAM=ROOT/'design/reference/moru-v2/native-semantic-family-v1'
          USAGE_ROOT=ROOT/'design/reference/moru-v2/native-usage-context-v1'
          LIGHT_ROOT=ROOT/'design/reference/moru-v2/native-lighting-family-v1'
          OUT=ROOT/'design/reference/moru-v2/native-semantic-export-readiness-v1'
          PROD=ROOT/'design/export-spec/moru-production-manifest.v2.json'
          MORU_MAN=ROOT/'design/reference/moru-v2/manifest.json'
          EXPORT_MAN=ROOT/'design/reference/moru-v2/export-manifest.v2.json'
          EXPRESSIONS=['neutral','happy','curious','surprised','clue_found','resolved']
          LIGHTINGS=['LIGHT','WARM_DUSK','DARK']
          AFFINITIES=['base','familiar','trusted','best_friend']
          USAGES=['map_avatar','hud_portrait','encounter_halfbody','result_large','companion_portrait','journal_crop']
          USAGE_DIMS={'map_avatar':[512,512],'hud_portrait':[768,768],'encounter_halfbody':[1024,1280],'result_large':[1280,1600],'companion_portrait':[1024,1280],'journal_crop':[768,768]}
          EXPECTED_COUNT=len(EXPRESSIONS)*len(LIGHTINGS)*len(AFFINITIES)*len(USAGES)
          SEMANTIC_PROFILE='companion.moru.canonical.v2'
          LEGACY='legacy_v1_static_semantic_fallback'

          mod=runpy.run_path('/tmp/moru02_semantic_authority.py', run_name='moru02_authority')
          derive_usage=mod['derive_usage']; apply_transfer=mod['apply_transfer']; edge_err=mod['edge_err']

          def file_sha(p:Path):
              h=hashlib.sha256()
              with p.open('rb') as f:
                  for b in iter(lambda:f.read(1048576),b''): h.update(b)
              return h.hexdigest()
          def pixel_sha(img:Image.Image):
              arr=np.ascontiguousarray(np.asarray(img.convert('RGBA'),dtype=np.uint8))
              return hashlib.sha256(arr.tobytes()).hexdigest()
          def alpha_sha(img:Image.Image):
              a=np.ascontiguousarray(np.asarray(img.convert('RGBA').getchannel('A'),dtype=np.uint8))
              return hashlib.sha256(a.tobytes()).hexdigest()
          def semantic_key(u,e,l,a): return f'companion/moru/v2/{u}/{e}/{l}/{a}'
          def output_name(u,e,l,a): return f'companion_moru_v2_{u}_{e}_{l}_{a}.png'

          sem=json.loads((FAM/'manifest.native-semantic.v1.json').read_text())
          smetrics=json.loads((FAM/'qa/moru_semantic_acceptance_metrics_v1.json').read_text())
          if sem.get('status')!='PASS_MORU_02_SEMANTIC_FAMILY_V1': raise SystemExit('SEMANTIC_AUTHORITY_NOT_PASS')
          if smetrics.get('verdict')!='PASS_MORU_02_SEMANTIC_FAMILY_V1': raise SystemExit('SEMANTIC_METRICS_NOT_PASS')
          light_metrics=json.loads((LIGHT_ROOT/'qa/moru_native_lighting_acceptance_metrics_v1.json').read_text())

          expr={}
          for e in EXPRESSIONS:
              rec=sem['expressions'][e]
              p=(FAM/rec['path']).resolve()
              im=Image.open(p).convert('RGBA')
              if im.size!=(1280,1600): raise SystemExit(f'EXPRESSION_DIM_FAIL:{e}:{im.size}')
              if file_sha(p)!=rec['sha256']: raise SystemExit(f'EXPRESSION_SHA_FAIL:{e}')
              expr[e]=im
          overlays={'base':None}
          for a in AFFINITIES[1:]:
              rec=sem['affinity'][a]; p=FAM/rec['path']; im=Image.open(p).convert('RGBA')
              if im.size!=(1280,1600) or file_sha(p)!=rec['sha256']: raise SystemExit(f'AFFINITY_AUTHORITY_FAIL:{a}')
              overlays[a]=im

          accepted_alpha={}
          accepted_pixel={}
          usage_files={
            'map_avatar':'companion_moru_v2_map_avatar_neutral_LIGHT_base.png',
            'hud_portrait':'companion_moru_v2_hud_portrait_neutral_LIGHT_base.png',
            'encounter_halfbody':'companion_moru_v2_encounter_halfbody_neutral_LIGHT_base.png',
            'result_large':'companion_moru_v2_result_large_neutral_LIGHT_base.png',
            'companion_portrait':'companion_moru_v2_companion_portrait_neutral_LIGHT_base.png',
            'journal_crop':'companion_moru_v2_journal_crop_neutral_LIGHT_base.png'}
          for u,fn in usage_files.items():
              im=Image.open(USAGE_ROOT/'candidate'/fn).convert('RGBA')
              accepted_alpha[u]=alpha_sha(im); accepted_pixel[(u,'LIGHT')]=pixel_sha(im)
              for l in ('WARM_DUSK','DARK'):
                  lp=LIGHT_ROOT/'candidate'/fn.replace('_LIGHT_',f'_{l}_')
                  accepted_pixel[(u,l)]=pixel_sha(Image.open(lp).convert('RGBA'))

          entries=[]; keyset=set(); checks={'count':0,'dimension':0,'alpha':0,'edge':0,'neutral_authority_exact':0}
          min_edge=999.0; max_edge=0.0
          # Cache usage framing before lighting: 24 semantic master combinations x 6 usages.
          usage_cache={}
          for e in EXPRESSIONS:
              for a in AFFINITIES:
                  master=expr[e] if a=='base' else Image.alpha_composite(expr[e],overlays[a])
                  for u in USAGES:
                      usage_cache[(u,e,a)]=derive_usage(master,u)

          for u in USAGES:
              for e in EXPRESSIONS:
                  for l in LIGHTINGS:
                      for a in AFFINITIES:
                          base=usage_cache[(u,e,a)]
                          img=base if l=='LIGHT' else apply_transfer(base,light_metrics['transfer'][l],l)
                          k=semantic_key(u,e,l,a)
                          if k in keyset: raise SystemExit(f'DUPLICATE_SEMANTIC_KEY:{k}')
                          keyset.add(k)
                          checks['count']+=1
                          if list(img.size)!=USAGE_DIMS[u]: raise SystemExit(f'DIMENSION_FAIL:{k}:{img.size}')
                          checks['dimension']+=1
                          ash=alpha_sha(img)
                          if ash!=accepted_alpha[u]: raise SystemExit(f'ALPHA_INVARIANCE_FAIL:{k}')
                          checks['alpha']+=1
                          ee=float(edge_err(img)); min_edge=min(min_edge,ee); max_edge=max(max_edge,ee)
                          if ee>1e-6: raise SystemExit(f'EDGE_BLEED_FAIL:{k}:{ee}')
                          checks['edge']+=1
                          if e=='neutral' and a=='base':
                              if pixel_sha(img)!=accepted_pixel[(u,l)]: raise SystemExit(f'NEUTRAL_AUTHORITY_DRIFT:{k}')
                              checks['neutral_authority_exact']+=1
                          source_expr=sem['expressions'][e]
                          source_aff=None if a=='base' else sem['affinity'][a]
                          entries.append({
                              'semantic_key':k,
                              'output_name':output_name(u,e,l,a),
                              'usage_context':u,'expression':e,'lighting':l,'affinity':a,
                              'dimensions':USAGE_DIMS[u],
                              'rgba_pixel_sha256':pixel_sha(img),
                              'alpha_pixel_sha256':ash,
                              'edge_bleed_mean_abs_rgb_error':ee,
                              'recipe':{
                                  'expression_source_sha256':source_expr['sha256'],
                                  'affinity_overlay_sha256':None if source_aff is None else source_aff['sha256'],
                                  'usage_transform':'accepted_native_usage_context_v1_exact_algorithm',
                                  'lighting_transform':'identity_LIGHT' if l=='LIGHT' else 'accepted_native_lighting_family_v1_exact_Lab_transfer',
                                  'composition_order':['expression_master','affinity_overlay','usage_framing','lighting_transfer']
                              }
                          })

          if len(entries)!=EXPECTED_COUNT or len(keyset)!=EXPECTED_COUNT: raise SystemExit(f'COVERAGE_COUNT_FAIL:{len(entries)}')
          if checks['neutral_authority_exact']!=len(USAGES)*len(LIGHTINGS): raise SystemExit('NEUTRAL_AUTHORITY_EXACT_COUNT_FAIL')

          def candidates(u,e,l,a):
              exact=semantic_key(u,e,l,a); same=semantic_key(u,e,'LIGHT','base'); neutral=semantic_key(u,'neutral','LIGHT','base')
              out=[]
              for x in (exact,same,neutral,LEGACY):
                  if x not in out: out.append(x)
              return out
          def resolve(u,e,l,a,available):
              if u not in USAGES or e not in EXPRESSIONS or l not in LIGHTINGS or a not in AFFINITIES:
                  return 'INVALID_REQUEST_FAIL_CLOSED'
              for c in candidates(u,e,l,a):
                  if c==LEGACY or c in available: return c
              raise AssertionError('unreachable')

          fallback={'exact_requests_tested':0,'single_exact_missing_tested':0,'same_expression_and_exact_missing_tested':0,'legacy_terminal_tested':0,'invalid_enum_fail_closed':0}
          for u in USAGES:
            for e in EXPRESSIONS:
             for l in LIGHTINGS:
              for a in AFFINITIES:
               k=semantic_key(u,e,l,a)
               if resolve(u,e,l,a,keyset)!=k: raise SystemExit(f'EXACT_RESOLVE_FAIL:{k}')
               fallback['exact_requests_tested']+=1
               avail=set(keyset); avail.remove(k)
               got=resolve(u,e,l,a,avail)
               same=semantic_key(u,e,'LIGHT','base'); neutral=semantic_key(u,'neutral','LIGHT','base')
               expected=(same if same!=k else neutral if neutral!=k else LEGACY)
               if got!=expected: raise SystemExit(f'SINGLE_MISSING_FALLBACK_FAIL:{k}:{got}:{expected}')
               fallback['single_exact_missing_tested']+=1
               avail=set(keyset); avail.discard(k); avail.discard(same)
               got=resolve(u,e,l,a,avail)
               expected=(neutral if neutral not in (k,same) else LEGACY)
               if got!=expected: raise SystemExit(f'CASCADE_FALLBACK_FAIL:{k}:{got}:{expected}')
               fallback['same_expression_and_exact_missing_tested']+=1
               avail=set(keyset); avail.discard(k); avail.discard(same); avail.discard(neutral)
               if resolve(u,e,l,a,avail)!=LEGACY: raise SystemExit(f'LEGACY_TERMINAL_FAIL:{k}')
               fallback['legacy_terminal_tested']+=1
          invalid_cases=[('bad','neutral','LIGHT','base'),('map_avatar','bad','LIGHT','base'),('map_avatar','neutral','BAD','base'),('map_avatar','neutral','LIGHT','bad')]
          for vals in invalid_cases:
              if resolve(*vals,keyset)!='INVALID_REQUEST_FAIL_CLOSED': raise SystemExit('INVALID_ENUM_NOT_FAIL_CLOSED')
              fallback['invalid_enum_fail_closed']+=1

          exp=json.loads(EXPORT_MAN.read_text())
          if exp.get('profile')!=SEMANTIC_PROFILE: raise SystemExit('PROFILE_DRIFT')
          if LEGACY not in exp.get('fallback_order',[]): raise SystemExit('LEGACY_FALLBACK_REMOVED')
          if 'Do not overwrite or silently repoint' not in exp.get('promotion_rule',''): raise SystemExit('NO_SILENT_REPOINT_RULE_MISSING')
          moru=json.loads(MORU_MAN.read_text())
          if moru.get('runtime_active') is not False: raise SystemExit('RUNTIME_ALREADY_ACTIVE_UNEXPECTED')
          main_head=subprocess.check_output(['git','rev-parse','origin/main'],text=True).strip()

          OUT.mkdir(parents=True,exist_ok=True); (OUT/'qa').mkdir(exist_ok=True)
          coverage={
            'version':'moru-semantic-export-readiness-v1-2026-09-14',
            'verdict':'PASS_MORU_03_ACTIVATION_READINESS_V1',
            'classification':'DESIGN_EXPORT_RESOLVER_READY_NOT_RUNTIME_ACTIVE',
            'semantic_profile':SEMANTIC_PROFILE,
            'cartesian_coverage':{'expressions':6,'lighting':3,'affinity':4,'usage_contexts':6,'total':EXPECTED_COUNT,'all_exact_recipes_present':True},
            'materialization_policy':{'validation':'all_432_materialized_in_fresh_GitHub_Actions_checkout','persisted_runtime_binaries':False,'reason':'avoid duplicating 432 deterministic derivatives before Android packaging choice; retain source masters + recipe + expected pixel hashes'},
            'resolver':{'fallback_order':['exact','same_context_expression_LIGHT_base','same_context_neutral_LIGHT_base',LEGACY],'invalid_enum':'fail_closed','fallback_static':'neutral/LIGHT/base/static'},
            'source_authorities':{
               'semantic_manifest_sha256':file_sha(FAM/'manifest.native-semantic.v1.json'),
               'semantic_metrics_sha256':file_sha(FAM/'qa/moru_semantic_acceptance_metrics_v1.json'),
               'lighting_metrics_sha256':file_sha(LIGHT_ROOT/'qa/moru_native_lighting_acceptance_metrics_v1.json'),
               'usage_metrics_sha256':file_sha(USAGE_ROOT/'qa/moru_native_usage_acceptance_metrics_v1.json')},
            'main_head_observed':main_head,
            'runtime_activation':False,
            'entries':entries
          }
          (OUT/'semantic-resolver-export-manifest.v1.json').write_text(json.dumps(coverage,indent=2)+'\n')
          metrics={
            'version':'moru-moru03-activation-readiness-v1-2026-09-14','verdict':'PASS_MORU_03_ACTIVATION_READINESS_V1',
            'expected_cartesian_count':EXPECTED_COUNT,'checks':checks,'fallback_tests':fallback,
            'max_edge_bleed_mean_abs_rgb_error':max_edge,'neutral_base_authority_exact_combinations':checks['neutral_authority_exact'],
            'legacy_v1_fallback_declared':True,'no_silent_repoint_rule_present':True,'runtime_binding_mutated':False,'runtime_activation':False,
            'main_head_observed':main_head
          }
          (OUT/'qa/moru_moru03_activation_readiness_metrics_v1.json').write_text(json.dumps(metrics,indent=2)+'\n')
          (OUT/'README.md').write_text('# Moru Semantic Export / Resolver Readiness v1\n\nStatus: **PASS_MORU_03_ACTIVATION_READINESS_V1 / not runtime-active**\n\nAll 432 semantic combinations were materialized ephemerally in a fresh GitHub Actions checkout and validated for dimensions, alpha invariance, transparent-edge bleed, accepted neutral authority exactness, semantic-key uniqueness and resolver fallback behavior. The repository persists the complete recipe/pixel-hash coverage manifest rather than 432 duplicate PNG derivatives. Android packaging/runtime activation remains a separate Development task and must not silently repoint the legacy v1 profile.\n')

          exp['status']='activation_readiness_pass_not_runtime_promoted'
          exp['fallback_order']=['exact','same_context_expression_LIGHT_base','same_context_neutral_LIGHT_base',LEGACY]
          exp['moru03_activation_readiness']={
              'status':'PASS_MORU_03_ACTIVATION_READINESS_V1','coverage_manifest':'design/reference/moru-v2/native-semantic-export-readiness-v1/semantic-resolver-export-manifest.v1.json',
              'coverage_count':EXPECTED_COUNT,'fallback_tests':fallback,'runtime_activation':False,'runtime_binding_mutated':False,
              'next':'Development runtime packaging/binding behind separately versioned v2 profile + physical outdoor Human Gate before promotion'}
          exp['naming_examples']['hud_portrait']='companion_moru_v2_hud_portrait_curious_LIGHT_base.webp'
          EXPORT_MAN.write_text(json.dumps(exp,indent=2)+'\n')

          prod=json.loads(PROD.read_text())
          prod['status']['runtime_promotion']='blocked_separate_development_and_human_gates'
          prod['moru03_activation_readiness_v1']={'status':'PASS_MORU_03_ACTIVATION_READINESS_V1','path':'design/reference/moru-v2/native-semantic-export-readiness-v1/','coverage_count':EXPECTED_COUNT,'runtime_activation':False,'next':'separate Development runtime packaging/binding; preserve v1 rollback and physical-device outdoor gate'}
          PROD.write_text(json.dumps(prod,indent=2)+'\n')

          moru['status']['runtime_production_export']='activation_readiness_pass_not_runtime_promoted'
          moru['status']['mobile_qa']='moru02_pass'
          moru['moru03_activation_readiness_v1']={'status':'PASS_MORU_03_ACTIVATION_READINESS_V1','path':'native-semantic-export-readiness-v1/','coverage_count':EXPECTED_COUNT,'runtime_active':False}
          moru['runtime_active']=False
          MORU_MAN.write_text(json.dumps(moru,indent=2)+'\n')
          print(json.dumps({'verdict':'PASS_MORU_03_ACTIVATION_READINESS_V1','coverage':EXPECTED_COUNT,'fallback_tests':fallback,'max_edge_error':max_edge,'main_head':main_head,'runtime_activation':False},indent=2))
          PY
          git diff --check

      - name: Commit MORU-03 readiness evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "AI Remote Work"
          git config user.email "ai-remote@local.invalid"
          git add design/reference/moru-v2/native-semantic-export-readiness-v1 \
                  design/reference/moru-v2/export-manifest.v2.json \
                  design/reference/moru-v2/manifest.json \
                  design/export-spec/moru-production-manifest.v2.json
          git commit -m "design: pass Moru MORU-03 activation readiness"
          git push origin HEAD:design/production-consolidated-v2

      - name: Remove one-shot readiness workflow
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "AI Remote Work"
          git config user.email "ai-remote@local.invalid"
          git pull --rebase origin design/production-consolidated-v2
          rm -f .github/workflows/moru-moru03-activation-readiness-once.yml
          git add -A .github/workflows/moru-moru03-activation-readiness-once.yml
          if ! git diff --cached --quiet; then
            git commit -m "chore: remove Moru MORU-03 readiness workflow"
            git push origin HEAD:design/production-consolidated-v2
          fi
