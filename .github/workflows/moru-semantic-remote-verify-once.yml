name: Moru semantic family remote binary verification once

on:
  push:
    branches:
      - design/production-consolidated-v2
    paths:
      - .github/workflows/moru-semantic-remote-verify-once.yml

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: design/production-consolidated-v2
          fetch-depth: 1
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install verification dependencies
        run: python -m pip install --disable-pip-version-check --no-cache-dir pillow numpy

      - name: Fresh-checkout verify semantic binaries
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          import numpy as np
          from PIL import Image

          root=Path.cwd()
          fam=root/'design/reference/moru-v2/native-semantic-family-v1'
          manifest=json.loads((fam/'manifest.native-semantic.v1.json').read_text())
          metrics=json.loads((fam/'qa/moru_semantic_acceptance_metrics_v1.json').read_text())
          prod=json.loads((root/'design/export-spec/moru-production-manifest.v2.json').read_text())
          neutral=root/'design/reference/moru-v2/native-master-v1/master/moru_candidate3_neutral_native_master_v1.png'

          def sha(p):
              h=hashlib.sha256()
              with p.open('rb') as f:
                  for b in iter(lambda:f.read(1048576),b''): h.update(b)
              return h.hexdigest()

          checks={}
          expected_neutral='b9e4d08d3af8cc7fe0ddc354e4086d2c9c18c3b18212917515aefa581cba3692'
          checks['neutral_hash']=sha(neutral)==expected_neutral
          nim=Image.open(neutral).convert('RGBA')
          na=np.asarray(nim)
          checks['neutral_dims_mode']=nim.size==(1280,1600) and Image.open(neutral).mode=='RGBA'

          verified={'expressions':{},'affinity':{},'qa':{}}
          for name,rec in manifest['expressions'].items():
              if name=='neutral':
                  continue
              p=fam/rec['path']
              im=Image.open(p)
              arr=np.asarray(im.convert('RGBA'))
              item={
                  'path':rec['path'],
                  'sha256':sha(p),
                  'expected_sha256':rec['sha256'],
                  'dimensions':list(im.size),
                  'mode':im.mode,
                  'alpha_minmax':[int(arr[...,3].min()),int(arr[...,3].max())],
                  'alpha_bit_identical_to_neutral':bool(np.array_equal(arr[...,3],na[...,3])),
              }
              item['pass']=item['sha256']==rec['sha256'] and im.size==(1280,1600) and im.mode=='RGBA' and item['alpha_bit_identical_to_neutral']
              checks[f'expression_{name}']=item['pass']
              verified['expressions'][name]=item

          for name,rec in manifest['affinity'].items():
              if name=='base':
                  continue
              p=fam/rec['path']
              im=Image.open(p)
              arr=np.asarray(im.convert('RGBA'))
              item={
                  'path':rec['path'],
                  'sha256':sha(p),
                  'expected_sha256':rec['sha256'],
                  'dimensions':list(im.size),
                  'mode':im.mode,
                  'alpha_minmax':[int(arr[...,3].min()),int(arr[...,3].max())],
                  'alpha_pixels':int((arr[...,3]>0).sum()),
              }
              item['pass']=item['sha256']==rec['sha256'] and im.size==(1280,1600) and im.mode=='RGBA' and item['alpha_pixels']==int(rec['alpha_pixels'])
              checks[f'affinity_{name}']=item['pass']
              verified['affinity'][name]=item

          qa_names=['moru_semantic_expression_hud64_qa_v1.png','moru_semantic_affinity_companion_qa_v1.png','moru_semantic_cross_family_companion_qa_v1.png','moru_semantic_expression_lighting_hud64_qa_v1.png']
          for q in qa_names:
              p=fam/'qa'/q
              im=Image.open(p)
              verified['qa'][q]={'sha256':sha(p),'dimensions':list(im.size),'mode':im.mode,'bytes':p.stat().st_size}
              checks[f'qa_{q}']=p.stat().st_size>0

          checks['semantic_manifest_status']=manifest.get('status')=='PASS_MORU_02_SEMANTIC_FAMILY_V1' and manifest.get('runtime_activation') is False
          checks['metrics_verdict']=metrics.get('verdict')=='PASS_MORU_02_SEMANTIC_FAMILY_V1'
          checks['usage_exact']=all(metrics.get('usage_fanout_exact_reproduction',{}).values())
          checks['lighting_exact']=all(metrics.get('lighting_transfer_exact_reproduction',{}).values())
          checks['production_manifest_status']=prod.get('native_semantic_family_v1',{}).get('status')=='PASS_MORU_02_SEMANTIC_FAMILY_V1'
          checks['production_runtime_blocked']=prod.get('status',{}).get('runtime_promotion')=='blocked' and prod.get('native_semantic_family_v1',{}).get('runtime_activation') is False
          checks['fallback_contract']=prod.get('semantic_contract',{}).get('fallback')=={'expression':'neutral','lighting':'LIGHT','affinity':'base','motion':'static'}

          verdict='PASS_REMOTE_BINARY_REVERIFY' if all(checks.values()) else 'FAIL_REMOTE_BINARY_REVERIFY'
          record={
              'version':'moru-native-semantic-family-v1-remote-reverify-2026-09-14',
              'verdict':verdict,
              'checkout_commit':__import__('subprocess').check_output(['git','rev-parse','HEAD'],text=True).strip(),
              'checks':checks,
              'verified':verified,
              'runtime_activation':False,
          }
          out=fam/'qa/remote_binary_verification.v1.json'
          out.write_text(json.dumps(record,indent=2)+'\n')
          print(json.dumps({'verdict':verdict,'checks':checks},indent=2))
          if verdict!='PASS_REMOTE_BINARY_REVERIFY':
              raise SystemExit(1)
          PY

      - name: Commit remote verification record
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "AI Remote Work"
          git config user.email "ai-remote@local.invalid"
          git add design/reference/moru-v2/native-semantic-family-v1/qa/remote_binary_verification.v1.json
          git commit -m "qa: verify Moru semantic family remote binaries"
          git push origin HEAD:design/production-consolidated-v2

      - name: Remove one-shot verifier
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "AI Remote Work"
          git config user.email "ai-remote@local.invalid"
          git pull --rebase origin design/production-consolidated-v2
          rm -f .github/workflows/moru-semantic-remote-verify-once.yml
          git add -A .github/workflows/moru-semantic-remote-verify-once.yml
          if ! git diff --cached --quiet; then
            git commit -m "chore: remove Moru semantic remote verifier"
            git push origin HEAD:design/production-consolidated-v2
          fi
