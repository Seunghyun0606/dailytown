name: Moru MORU-02 neutral usage QA v2 one-shot

on:
  push:
    branches:
      - design/production-consolidated-v2
    paths:
      - '.github/workflows/moru-moru02-neutral-usage-qa-v2-once.yml'

permissions:
  contents: write

jobs:
  qa:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install raster QA tooling
        run: python -m pip install --disable-pip-version-check pillow numpy scipy
      - name: Run corrected neutral usage derivation and QA
        shell: bash
        run: |
          set +e
          python3 scripts/moru_moru02_neutral_usage_qa_v2_once.py
          code=$?
          echo "$code" > /tmp/moru02-v2-exit-code
          exit 0
      - name: Persist result and remove one-shot runner
        shell: bash
        run: |
          set -euo pipefail
          code="$(cat /tmp/moru02-v2-exit-code)"
          git config user.name "AI Remote Work"
          git config user.email "ai-remote@local.invalid"
          git rm --ignore-unmatch .github/workflows/moru-moru02-neutral-usage-qa-v2-once.yml scripts/moru_moru02_neutral_usage_qa_v2_once.py
          git add -A design/reference/moru-v2 design/export-spec/moru-production-manifest.v2.json
          if ! git diff --cached --quiet; then
            if [[ "$code" == "0" ]]; then msg="design: pass Moru neutral usage-context QA v1"; else msg="docs: record corrected Moru neutral usage QA failure"; fi
            git commit -m "$msg"
            git push origin HEAD:design/production-consolidated-v2
          fi
          if [[ "$code" != "0" ]]; then exit "$code"; fi
