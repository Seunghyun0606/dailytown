name: Moru MORU-03 persisted manifest verification once

on:
  push:
    branches:
      - design/production-consolidated-v2
    paths:
      - .github/workflows/moru-moru03-remote-verify-once.yml

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: design/production-consolidated-v2
          fetch-depth: 1
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify persisted MORU-03 coverage and contracts
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,subprocess
          from itertools import product
          from pathlib import Path
          R=Path.cwd(); root=R/'design/reference/moru-v2/native-semantic-export-readiness-v1'; cov=json.loads((root/'semantic-resolver-export-manifest.v1.json').read_text()); met=json.loads((root/'qa/moru_moru03_activation_readiness_metrics_v1.json').read_text()); exp=json.loads((R/'design/reference/moru-v2/export-manifest.v2.json').read_text()); prod=json.loads((R/'design/export-spec/moru-production-manifest.v2.json').read_text()); moru=json.loads((R/'design/reference/moru-v2/manifest.json').read_text())
          def sha(p):return hashlib.sha256(p.read_bytes()).hexdigest()
          E=['neutral','happy','curious','surprised','clue_found','resolved']; L=['LIGHT','WARM_DUSK','DARK']; A=['base','familiar','trusted','best_friend']; U=['map_avatar','hud_portrait','encounter_halfbody','result_large','companion_portrait','journal_crop']; dims={'map_avatar':[512,512],'hud_portrait':[768,768],'encounter_halfbody':[1024,1280],'result_large':[1280,1600],'companion_portrait':[1024,1280],'journal_crop':[768,768]}
          checks={}; entries=cov.get('entries',[]); keys=[x.get('semantic_key') for x in entries]; expected={f'companion/moru/v2/{u}/{e}/{l}/{a}' for u,e,l,a in product(U,E,L,A)}
          checks['coverage_verdict']=cov.get('verdict')=='PASS_MORU_03_ACTIVATION_READINESS_V1' and cov.get('runtime_activation') is False
          checks['entry_count']=len(entries)==432
          checks['unique_keys']=len(set(keys))==432
          checks['exact_keyset']=set(keys)==expected
          checks['dimensions']=all(x.get('dimensions')==dims[x.get('usage_context')] for x in entries)
          checks['pixel_hash_shape']=all(len(x.get('rgba_pixel_sha256',''))==64 and len(x.get('alpha_pixel_sha256',''))==64 for x in entries)
          checks['recipe_order']=all(x.get('recipe',{}).get('composition_order')==['expression_master','affinity_overlay','usage_framing','lighting_transfer'] for x in entries)
          checks['metrics_verdict']=met.get('verdict')=='PASS_MORU_03_ACTIVATION_READINESS_V1' and met.get('checks',{}).get('count')==432 and met.get('max_edge_delta_from_accepted_authority')==0.0
          checks['fallback_counts']=all(met.get('fallback_tests',{}).get(k)==432 for k in ['exact_requests_tested','single_exact_missing_tested','same_expression_and_exact_missing_tested','legacy_terminal_tested']) and met.get('fallback_tests',{}).get('invalid_enum_fail_closed')==4
          checks['export_manifest_status']=exp.get('status')=='activation_readiness_pass_not_runtime_promoted' and exp.get('moru03_activation_readiness',{}).get('coverage_count')==432 and exp.get('moru03_activation_readiness',{}).get('runtime_activation') is False
          checks['production_manifest_status']=prod.get('moru03_activation_readiness_v1',{}).get('status')=='PASS_MORU_03_ACTIVATION_READINESS_V1' and prod.get('moru03_activation_readiness_v1',{}).get('runtime_activation') is False
          checks['runtime_still_inactive']=moru.get('runtime_active') is False and moru.get('moru03_activation_readiness_v1',{}).get('runtime_active') is False
          checks['legacy_fallback_retained']='legacy_v1_static_semantic_fallback' in exp.get('fallback_order',[]) and 'Do not overwrite or silently repoint' in exp.get('promotion_rule','')
          auth=cov.get('source_authorities',{}); checks['semantic_manifest_sha']=auth.get('semantic_manifest_sha256')==sha(R/'design/reference/moru-v2/native-semantic-family-v1/manifest.native-semantic.v1.json'); checks['semantic_metrics_sha']=auth.get('semantic_metrics_sha256')==sha(R/'design/reference/moru-v2/native-semantic-family-v1/qa/moru_semantic_acceptance_metrics_v1.json'); checks['lighting_metrics_sha']=auth.get('lighting_metrics_sha256')==sha(R/'design/reference/moru-v2/native-lighting-family-v1/qa/moru_native_lighting_acceptance_metrics_v1.json'); checks['usage_metrics_sha']=auth.get('usage_metrics_sha256')==sha(R/'design/reference/moru-v2/native-usage-context-v1/qa/moru_native_usage_acceptance_metrics_v1.json')
          verdict='PASS_REMOTE_MANIFEST_REVERIFY' if all(checks.values()) else 'FAIL_REMOTE_MANIFEST_REVERIFY'; record={'version':'moru-moru03-remote-manifest-reverify-2026-09-14','verdict':verdict,'checkout_commit':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),'coverage_manifest_sha256':sha(root/'semantic-resolver-export-manifest.v1.json'),'metrics_sha256':sha(root/'qa/moru_moru03_activation_readiness_metrics_v1.json'),'checks':checks,'runtime_activation':False}; (root/'qa/remote_manifest_verification.v1.json').write_text(json.dumps(record,indent=2)+'\n'); print(json.dumps(record,indent=2));
          if verdict!='PASS_REMOTE_MANIFEST_REVERIFY':raise SystemExit(1)
          PY
      - name: Commit remote verification record
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "AI Remote Work"; git config user.email "ai-remote@local.invalid"
          git add design/reference/moru-v2/native-semantic-export-readiness-v1/qa/remote_manifest_verification.v1.json
          git commit -m "qa: verify Moru MORU-03 persisted readiness manifest"
          git push origin HEAD:design/production-consolidated-v2
      - name: Remove one-shot verifier
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "AI Remote Work"; git config user.email "ai-remote@local.invalid"
          git pull --rebase origin design/production-consolidated-v2
          rm -f .github/workflows/moru-moru03-remote-verify-once.yml
          git add -A .github/workflows/moru-moru03-remote-verify-once.yml
          if ! git diff --cached --quiet; then git commit -m "chore: remove Moru MORU-03 remote verifier"; git push origin HEAD:design/production-consolidated-v2; fi
