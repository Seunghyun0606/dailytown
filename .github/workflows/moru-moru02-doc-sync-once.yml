name: Moru MORU-02 PASS docs sync one-shot

on:
  push:
    branches:
      - design/production-consolidated-v2
    paths:
      - '.github/workflows/moru-moru02-doc-sync-once.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Synchronize MORU-02 neutral usage PASS state
        run: python3 scripts/moru_moru02_docs_sync_once.py
      - name: Commit synchronized status and remove one-shot runner
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "AI Remote Work"
          git config user.email "ai-remote@local.invalid"
          git rm .github/workflows/moru-moru02-doc-sync-once.yml scripts/moru_moru02_docs_sync_once.py
          git add docs/design/PRODUCTION_WORK_ITEMS_V2.md docs/design/MORU_SOURCE_SUFFICIENCY_V2.md design/reference/REFERENCE_IMAGE_REGISTRY_V2.md
          git commit -m "docs: advance Moru neutral usage QA state"
          git push origin HEAD:design/production-consolidated-v2
