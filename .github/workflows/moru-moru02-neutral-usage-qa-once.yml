name: Moru MORU-02 neutral usage QA one-shot

on:
  push:
    branches:
      - design/production-consolidated-v2
    paths:
      - '.github/workflows/moru-moru02-neutral-usage-qa-once.yml'

permissions:
  contents: write

jobs:
  qa:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install raster QA tooling
        run: python -m pip install --disable-pip-version-check pillow numpy scipy

      - name: Derive neutral usage contexts and run MORU-02 baseline QA
        shell: bash
        run: |
          set +e
          python3 scripts/moru_moru02_neutral_usage_qa_once.py
          code=$?
          echo "$code" > /tmp/moru02-exit-code
          exit 0

      - name: Persist PASS or failure record and remove one-shot runner
        shell: bash
        run: |
          set -euo pipefail
          code="$(cat /tmp/moru02-exit-code)"
          git config user.name "AI Remote Work"
          git config user.email "ai-remote@local.invalid"
          git rm --ignore-unmatch .github/workflows/moru-moru02-neutral-usage-qa-once.yml scripts/moru_moru02_neutral_usage_qa_once.py
          if [[ "$code" != "0" ]] && [[ ! -f design/reference/moru-v2/native-master-v1/qa/FAILURE_MORU_02_NEUTRAL_USAGE_V1.md ]]; then
            cat > design/reference/moru-v2/native-master-v1/qa/FAILURE_MORU_02_NEUTRAL_USAGE_V1.md <<'EOF'
          # Moru neutral usage-context QA runner failure

          The one-shot MORU-02 neutral usage runner exited before a compliant usage-context family could be persisted. No candidate family is promoted by this record.
          EOF
          fi
          git add -A design/reference/moru-v2 design/export-spec/moru-production-manifest.v2.json
          if ! git diff --cached --quiet; then
            if [[ "$code" == "0" ]]; then
              git commit -m "design: add Moru neutral usage-context QA v1"
            else
              git commit -m "docs: record Moru neutral usage QA failure"
            fi
            git push origin HEAD:design/production-consolidated-v2
          fi
          if [[ "$code" != "0" ]]; then exit "$code"; fi
