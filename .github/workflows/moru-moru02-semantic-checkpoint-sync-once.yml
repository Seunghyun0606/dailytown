name: Moru MORU-02 semantic checkpoint sync one-shot

on:
  push:
    branches:
      - design/production-consolidated-v2
    paths:
      - '.github/workflows/moru-moru02-semantic-checkpoint-sync-once.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install verifier dependency
        run: python -m pip install --disable-pip-version-check pillow
      - name: Align registry checkpoint pattern
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/moru_moru02_semantic_checkpoint_sync_v2_once.py')
          s = p.read_text()
          old = '- Moru canonical source board: **exact PNG persisted**. Strict no-upscale deterministic reference QA remains **map PASS; HUD/journal FAIL** as historical evidence. Native neutral master v1 is **PASS and remote-binary-verified** at `design/reference/moru-v2/native-master-v1/`; native usage-context family/MORU-02 remain pending and runtime promotion remains blocked.'
          new = '- Moru canonical source board: **exact PNG persisted**. Strict no-upscale deterministic reference QA remains **map PASS; HUD/journal FAIL** as historical evidence. Native neutral master v1 is **PASS and remote-binary-verified** at `design/reference/moru-v2/native-master-v1/`; the six-context `neutral / LIGHT / base / static` native usage family and Android-size/edge baseline are also **PASS and remote-binary-verified** at `design/reference/moru-v2/native-usage-context-v1/`. Expression/lighting/affinity MORU-02 coverage remains pending and runtime promotion remains blocked.'
          if old not in s:
              raise SystemExit('PATCH_TARGET_MISSING')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Verify handoff and sync docs
        run: python3 scripts/moru_moru02_semantic_checkpoint_sync_v2_once.py
      - name: Persist verification/docs and remove one-shot runner
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "AI Remote Work"
          git config user.email "ai-remote@local.invalid"
          git rm .github/workflows/moru-moru02-semantic-checkpoint-sync-once.yml scripts/moru_moru02_semantic_checkpoint_sync_once.py scripts/moru_moru02_semantic_checkpoint_sync_v2_once.py
          git add -A design/reference/moru-v2/native-semantic-authoring-handoff-v1 docs/design/PRODUCTION_WORK_ITEMS_V2.md docs/design/MORU_SOURCE_SUFFICIENCY_V2.md design/reference/REFERENCE_IMAGE_REGISTRY_V2.md
          git commit -m "docs: sync Moru lighting and semantic authoring checkpoint"
          git push origin HEAD:design/production-consolidated-v2
