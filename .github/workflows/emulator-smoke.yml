name: Emulator Replay Smoke Test

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "app/build.gradle.kts"
      - "app/src/androidTest/**"
      - "app/src/main/java/com/dailytown/app/ui/**"
      - "app/src/main/java/com/dailytown/app/location/**"
      - ".github/workflows/emulator-smoke.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  replay-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 15859902
          packages: platform-tools
      - name: Install Android build SDK and emulator
        run: sdkmanager "platforms;android-37.0" "build-tools;37.0.0" emulator
      - name: Enable KVM access when available
        run: |
          if [ -e /dev/kvm ]; then
            sudo chmod 666 /dev/kvm
          fi
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"
      - name: Run replay smoke test on managed virtual device
        run: >-
          gradle pixel2Api30AtdDebugAndroidTest
          -Pandroid.testoptions.manageddevices.emulator.gpu=swiftshader_indirect
      - name: Upload instrumented test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dailytown-emulator-test-reports
          path: |
            app/build/reports/androidTests/**
            app/build/outputs/androidTest-results/**
          if-no-files-found: warn
          retention-days: 7
